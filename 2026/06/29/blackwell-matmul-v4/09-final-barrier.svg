<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="870" viewBox="0 0 1440 870"><rect x="0" y="0" width="1440" height="870" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">F 就是 mainloop barrier：保护最终输出的读取</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">__syncthreads 只等待线程汇合；不会自动把已经提交的异步 MMA 全部等完。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="start" x="40" y="172.5" fill="#20334D">控制线程的进度</text><rect x="40" y="220" width="320" height="80" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="200.0" y="260.0" fill="#20334D">提交最后的 MMA</text><line stroke-width="2" x1="365" y1="260" x2="379" y2="260" stroke="#5F7086" /><polygon points="379,260 369,254 369,266" fill="#5F7086" /><rect x="385" y="220" width="320" height="80" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="545.0" y="260.0" fill="#20334D">额外 commit 到 F</text><line stroke-width="2" x1="710" y1="260" x2="724" y2="260" stroke="#5F7086" /><polygon points="724,260 714,254 714,266" fill="#5F7086" /><rect x="730" y="220" width="320" height="80" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="890.0" y="260.0" fill="#20334D">线程汇合</text><line stroke-width="2" x1="1055" y1="260" x2="1069" y2="260" stroke="#5F7086" /><polygon points="1069,260 1059,254 1059,266" fill="#5F7086" /><rect x="1075" y="220" width="320" height="80" fill="#9A65A8" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1235.0" y="260.0" fill="white">wait(F, 0)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="start" x="40" y="377.5" fill="#20334D">Tensor Core 的进度</text><rect x="40" y="425" width="900" height="80" fill="#138A78" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" dominant-baseline="central" text-anchor="middle" x="490.0" y="465.0" fill="white">仍可能在执行此前提交的 MMA</text><rect x="980" y="425" width="420" height="80" fill="#9A65A8" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1190.0" y="465.0" fill="white">全部完成 → 通知 F</text><line stroke-width="2" x1="1190" y1="510" x2="1190" y2="565" stroke="#5F7086" /><polygon points="1190,565 1184,555 1196,555" fill="#5F7086" /><rect x="40" y="580" width="1360" height="90" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" dominant-baseline="central" text-anchor="middle" x="720.0" y="625.0" fill="#20334D">F 等待通过 → fence → 读取 TMEM → 写 global C</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="start" x="40" y="749.0" fill="#20334D">V3 每轮末尾已等 MMA，包括最后一轮，所以不需要额外 F。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="40" y="807.5" fill="#20334D">V4 必须有最终完成等待；独立 F 是源码的选择，并非唯一可行协议。</text></svg>