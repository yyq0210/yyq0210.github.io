<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930"><rect x="0" y="0" width="1440" height="930" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">06｜搬入 SMEM：谁负责某元素，不由 SMEM 地址本身决定</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">以下为所查 main 分支 cooperative_copy&lt;128&gt; 的分工推导：默认 MaxVecBits=元素位宽=16。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="45" y="212.5" fill="#20334D">row 0</text><rect x="160" y="180" width="575" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="447.5" y="212.5" fill="#20334D">K 0…31  /  warp 0  /  tid 0…31</text><rect x="760" y="180" width="575" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1047.5" y="212.5" fill="#20334D">K 32…63  /  warp 1  /  tid 32…63</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="45" y="302.5" fill="#20334D">row 1</text><rect x="160" y="270" width="575" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="447.5" y="302.5" fill="#20334D">K 0…31  /  warp 2  /  tid 64…95</text><rect x="760" y="270" width="575" height="65" fill="#DAEBF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1047.5" y="302.5" fill="#20334D">K 32…63  /  warp 3  /  tid 96…127</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="45" y="392.5" fill="#20334D">row 2</text><rect x="160" y="360" width="575" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="447.5" y="392.5" fill="#20334D">K 0…31  /  warp 0  /  tid 0…31</text><rect x="760" y="360" width="575" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1047.5" y="392.5" fill="#20334D">K 32…63  /  warp 1  /  tid 32…63</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="45" y="482.5" fill="#20334D">row 3</text><rect x="160" y="450" width="575" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="447.5" y="482.5" fill="#20334D">K 0…31  /  warp 2  /  tid 64…95</text><rect x="760" y="450" width="575" height="65" fill="#DAEBF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1047.5" y="482.5" fill="#20334D">K 32…63  /  warp 3  /  tid 96…127</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" dominant-baseline="central" text-anchor="start" x="55" y="602.5" fill="#20334D">在一轮 K64 内：线程 tid 负责 x=tid%64，row=tid/64 + 2r</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="start" x="55" y="667.5" fill="#20334D">A：r=0…63，每线程 64 个 FP16。 B：r=0…127，每线程 128 个 FP16。</text><rect x="55" y="740" width="1320" height="110" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="715.0" y="779.475" fill="#20334D">A 的 row=37、x=39：tid=64×(37%2)+39=103</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="715.0" y="810.525" fill="#20334D">同一 tid=103 也搬 B 的 row=69、x=39。输出 Acc[37,69] 则由 tid=37 读回。</text></svg>