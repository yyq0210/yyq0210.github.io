<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect x="0" y="0" width="1440" height="1000" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">追踪 A[1,2]：同一个值，经历三种线程角色</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">示例：block (0,0)，第一个 K tile / stage 0，warp 0，k=0，m=0。地址以字节为单位。</text><rect x="40" y="145" width="650" height="65" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="365.0" y="177.5" fill="#20334D">① GMEM：A[1,2]</text><rect x="40" y="210" width="650" height="155" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="365.0" y="255.09999999999997" fill="#20334D">复制线程 tid=8</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="365.0" y="287.49999999999994" fill="#20334D">copy_iter=0：搬 A[1,0:8]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="365.0" y="319.9" fill="#20334D">其中包含 A[1,2]</text><rect x="750" y="145" width="650" height="65" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1075.0" y="177.5" fill="#20334D">② SMEM：偏移 148B</text><rect x="750" y="210" width="650" height="155" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1075.0" y="255.09999999999997" fill="#20334D">row=1，logical pack=0</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1075.0" y="287.49999999999994" fill="#20334D">physical pack=0 XOR 1=1</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1075.0" y="319.9" fill="#20334D">128+16+2×2=148B</text><rect x="40" y="445" width="650" height="65" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="365.0" y="477.5" fill="#20334D">③ ldmatrix：地址由 L1 给出</text><rect x="40" y="510" width="650" height="155" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="365.0" y="555.1" fill="#20334D">L1 提供 A[1,0] 的地址 144B</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="365.0" y="587.5" fill="#20334D">这 16B 分发给 L4、L5、L6、L7</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="365.0" y="619.9000000000001" fill="#20334D">L5 拿 A[1,2] 与 A[1,3]</text><rect x="750" y="445" width="650" height="65" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1075.0" y="477.5" fill="#20334D">④ Registers：L5 的 a0</text><rect x="750" y="510" width="650" height="155" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1075.0" y="555.1" fill="#20334D">a0.low16 = A[1,2]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1075.0" y="587.5" fill="#20334D">a0.high16 = A[1,3]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1075.0" y="619.9000000000001" fill="#20334D">L5 还持有另外三个 A 寄存器</text><rect x="40" y="780" width="1360" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="720.0" y="812.5" fill="#20334D">L5 的 acc 对应 C[1,2]、C[1,3]、C[9,2]、C[9,3]。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="902.5" fill="#20334D">但不是 L5 只用自己的 A/B 做点积：mma.sync 由整个 warp 合作完成，使用全 warp 的分片。</text></svg>