<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"><rect x="0" y="0" width="1440" height="820" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">v2 的数据流：128B TMA + swizzle + tcgen05</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">固定示例：BLOCK_M=128，BLOCK_N=256，BLOCK_K=256，BF16 输入 / FP32 累加</text><rect x="40" y="150" width="360" height="86" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="220.0" y="176.8" fill="#20334D">Global A</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="220.0" y="209.2" fill="#20334D">[M, K]</text><rect x="470" y="150" width="360" height="86" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="650.0" y="176.8" fill="#20334D">Global B</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="650.0" y="209.2" fill="#20334D">[N, K]</text><rect x="920" y="150" width="470" height="135" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1155.0" y="187.79999999999998" fill="#20334D">CPU 编码 tensor map</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1155.0" y="217.49999999999997" fill="#20334D">形状、步长、box</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1155.0" y="247.2" fill="#20334D">128B swizzle</text><line stroke-width="2" x1="220" y1="240" x2="220" y2="320" stroke="#5F7086" /><polygon points="220,320 214,310 226,310" fill="#5F7086" /><line stroke-width="2" x1="650" y1="240" x2="650" y2="320" stroke="#5F7086" /><polygon points="650,320 644,310 656,310" fill="#5F7086" /><rect x="40" y="330" width="360" height="100" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="220.0" y="364.47499999999997" fill="white">SMEM A：64 KiB</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="220.0" y="395.525" fill="white">4 个 128×64 宽切片</text><rect x="470" y="330" width="360" height="100" fill="#138A78" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="650.0" y="364.47499999999997" fill="white">SMEM B：128 KiB</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="650.0" y="395.525" fill="white">4 个 256×64 宽切片</text><rect x="920" y="330" width="470" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1155.0" y="365.825" fill="#20334D">TMA 硬件按描述符重排</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1155.0" y="394.175" fill="#20334D">每个 16B 小包内部不变</text><line stroke-width="2" x1="220" y1="435" x2="220" y2="485" stroke="#5F7086" /><polygon points="220,485 214,475 226,475" fill="#5F7086" /><line stroke-width="2" x1="650" y1="435" x2="650" y2="485" stroke="#5F7086" /><polygon points="650,485 644,475 656,475" fill="#5F7086" /><rect x="40" y="495" width="790" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="435.0" y="528.125" fill="#20334D">16 次 MMA：每次 128×256×16</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="435.0" y="561.875" fill="#20334D">所有 MMA 累加到同一块 TMEM</text><rect x="920" y="495" width="470" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1155.0" y="530.15" fill="#20334D">MMA descriptor</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1155.0" y="559.85" fill="#20334D">指定相同的 128B swizzle</text><line stroke-width="2" x1="435" y1="600" x2="435" y2="646" stroke="#5F7086" /><polygon points="435,646 429,636 441,636" fill="#5F7086" /><rect x="40" y="656" width="1350" height="75" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="715.0" y="693.5" fill="#20334D">TMEM [128,256] FP32 → 寄存器 → BF16 → Global C</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="start" x="40" y="772.0" fill="#20334D">每轮 iter_k 都复用同一块 SMEM；必须先等待 MMA 完成，再搬入下一轮数据。</text></svg>