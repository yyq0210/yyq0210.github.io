<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800"><rect x="0" y="0" width="1440" height="800" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">两个输入 stage，共用一个 TMEM 累加器</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">swizzle 和 MMA 描述符沿用 v2；stage 只改变 A/B 缓冲基址。</text><rect x="40" y="170" width="600" height="105" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="340.0" y="205.625" fill="white">stage 0：A/B</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="340.0" y="239.375" fill="white">tile 0、2、4…</text><rect x="800" y="170" width="600" height="105" fill="#9A65A8" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="1100.0" y="205.625" fill="white">stage 1：A/B</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="1100.0" y="239.375" fill="white">tile 1、3、5…</text><line stroke-width="2" x1="340" y1="280" x2="340" y2="330" stroke="#5F7086" /><polygon points="340,330 334,320 346,320" fill="#5F7086" /><line stroke-width="2" x1="1100" y1="280" x2="1100" y2="330" stroke="#5F7086" /><polygon points="1100,330 1094,320 1106,320" fill="#5F7086" /><rect x="40" y="340" width="1360" height="115" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" dominant-baseline="central" text-anchor="middle" x="720.0" y="379.95" fill="#20334D">每 tile：2 个宽切片 × 每片 4 次 MMA = 8 次 MMA</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" dominant-baseline="central" text-anchor="middle" x="720.0" y="415.05" fill="#20334D">每次 128×256×16；仅整个 K 归约的第一条不累加旧值</text><line stroke-width="2" x1="720" y1="460" x2="720" y2="515" stroke="#5F7086" /><polygon points="720,515 714,505 726,505" fill="#5F7086" /><rect x="290" y="525" width="860" height="115" fill="#138A78" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="720.0" y="565.625" fill="white">同一块 TMEM：128×256 FP32</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="720.0" y="599.375" fill="white">32 个 K tile × 8 次 MMA = 每 block 256 次 MMA</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="start" x="40" y="728.5" fill="#20334D">只在全部 K tile 完成后：TMEM → 寄存器 → BF16 → Global C。不是每个 stage 各写一份 C。</text></svg>