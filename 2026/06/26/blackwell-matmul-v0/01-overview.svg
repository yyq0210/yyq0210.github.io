<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950"><rect x="0" y="0" width="1440" height="950" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">V0：一条完整的数据路径</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">固定源码默认参数：CTA 128 线程；输出 128×128；每轮 K=64；BF16 输入 / FP32 累加。</text><rect x="40" y="160" width="310" height="60" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="195.0" y="190.0" fill="#20334D">GMEM</text><rect x="40" y="220" width="310" height="140" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="195.0" y="263.0" fill="#20334D">A：M×K，行主序</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="195.0" y="290.0" fill="#20334D">Bphys：N×K，行主序</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="195.0" y="317.0" fill="#20334D">数学运算：A × Bphys^T</text><line stroke-width="2" x1="350" y1="260" x2="385" y2="260" stroke="#5F7086" /><polygon points="385,260 375,254 375,266" fill="#5F7086" /><rect x="390" y="160" width="310" height="60" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="545.0" y="190.0" fill="#20334D">SMEM</text><rect x="390" y="220" width="310" height="140" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="545.0" y="263.0" fill="#20334D">每 stage：A 16 KiB</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="545.0" y="290.0" fill="#20334D">+ B 16 KiB</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="545.0" y="317.0" fill="#20334D">3 stages = 96 KiB</text><line stroke-width="2" x1="700" y1="260" x2="735" y2="260" stroke="#5F7086" /><polygon points="735,260 725,254 725,266" fill="#5F7086" /><rect x="740" y="160" width="310" height="60" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="895.0" y="190.0" fill="#20334D">Registers</text><rect x="740" y="220" width="310" height="140" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="895.0" y="263.0" fill="#20334D">每 lane 的输入分片</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="895.0" y="290.0" fill="#20334D">A：4 个 packed 寄存器</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="895.0" y="317.0" fill="#20334D">B：2 个 packed 寄存器</text><line stroke-width="2" x1="1050" y1="260" x2="1085" y2="260" stroke="#5F7086" /><polygon points="1085,260 1075,254 1075,266" fill="#5F7086" /><rect x="1090" y="160" width="310" height="60" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="1245.0" y="190.0" fill="#20334D">MMA + ACC</text><rect x="1090" y="220" width="310" height="140" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="1245.0" y="263.0" fill="#20334D">warp 合作算 16×8×16</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="1245.0" y="290.0" fill="#20334D">每 lane 持有 4 个 FP32</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="1245.0" y="317.0" fill="#20334D">累加结果保留在寄存器</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="45" y="400.0" fill="#20334D">cp.async：每线程每条 16B</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="500" y="400.0" fill="#20334D">ldmatrix.x4：32 lanes 协作</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="990" y="400.0" fill="#20334D">mma.sync：32 lanes 协作</text><rect x="40" y="450" width="1360" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="720.0" y="481.0" fill="#20334D">重要：输入寄存器数量按“一条 MMA”计；源码每线程数组还保存了多个子块的分片。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="start" x="40" y="565.0" fill="#20334D">一个 CTA 的输出 C[128,128]：4 个 warp 按 2×2 分工</text><rect x="80" y="610" width="610" height="105" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="385.0" y="646.3000000000001" fill="#20334D">warp 0 / tid 0–31</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="385.0" y="678.7" fill="#20334D">C 行 0–63，列 0–63</text><rect x="730" y="610" width="610" height="105" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1035.0" y="646.3000000000001" fill="#20334D">warp 1 / tid 32–63</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1035.0" y="678.7" fill="#20334D">C 行 0–63，列 64–127</text><rect x="80" y="735" width="610" height="105" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="385.0" y="771.3000000000001" fill="#20334D">warp 2 / tid 64–95</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="385.0" y="803.7" fill="#20334D">C 行 64–127，列 0–63</text><rect x="730" y="735" width="610" height="105" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1035.0" y="771.3000000000001" fill="#20334D">warp 3 / tid 96–127</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1035.0" y="803.7" fill="#20334D">C 行 64–127，列 64–127</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="900.0" fill="#20334D">V0 没有 TMEM；最后由各 lane 把自己的 FP32 acc 转为 BF16，直接写回 GMEM。</text></svg>