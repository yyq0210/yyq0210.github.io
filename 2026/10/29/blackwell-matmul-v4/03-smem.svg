<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920"><rect x="0" y="0" width="1440" height="920" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">V4 的 7 份输入缓冲：每份 32 KiB，总计 224 KiB</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">每个 stage 都含 A[128,64] 和 B[128,64]；BF16 每元素 2B。表中区间相对 smem 起点。</text><rect x="40" y="145" width="160" height="55" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="120.0" y="172.5" fill="#20334D">stage</text><rect x="200" y="145" width="380" height="55" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="390.0" y="172.5" fill="#20334D">A：16 KiB</text><rect x="580" y="145" width="380" height="55" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="770.0" y="172.5" fill="#20334D">B：16 KiB</text><rect x="960" y="145" width="440" height="55" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1180.0" y="172.5" fill="#20334D">循环存放的 K tile</text><rect x="40" y="210" width="160" height="62" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="120.0" y="241.0" fill="white">0</text><rect x="200" y="210" width="380" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="390.0" y="241.0" fill="#20334D">[0, 16) KiB</text><rect x="580" y="210" width="380" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="770.0" y="241.0" fill="#20334D">[16, 32) KiB</text><rect x="960" y="210" width="440" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1180.0" y="241.0" fill="#20334D">0 → 7 → 14 → …</text><rect x="40" y="280" width="160" height="62" fill="#138A78" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="120.0" y="311.0" fill="white">1</text><rect x="200" y="280" width="380" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="390.0" y="311.0" fill="#20334D">[32, 48) KiB</text><rect x="580" y="280" width="380" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="770.0" y="311.0" fill="#20334D">[48, 64) KiB</text><rect x="960" y="280" width="440" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1180.0" y="311.0" fill="#20334D">1 → 8 → 15 → …</text><rect x="40" y="350" width="160" height="62" fill="#9A65A8" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="120.0" y="381.0" fill="white">2</text><rect x="200" y="350" width="380" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="390.0" y="381.0" fill="#20334D">[64, 80) KiB</text><rect x="580" y="350" width="380" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="770.0" y="381.0" fill="#20334D">[80, 96) KiB</text><rect x="960" y="350" width="440" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1180.0" y="381.0" fill="#20334D">2 → 9 → 16 → …</text><rect x="40" y="420" width="160" height="62" fill="#C47527" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="120.0" y="451.0" fill="white">3</text><rect x="200" y="420" width="380" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="390.0" y="451.0" fill="#20334D">[96, 112) KiB</text><rect x="580" y="420" width="380" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="770.0" y="451.0" fill="#20334D">[112, 128) KiB</text><rect x="960" y="420" width="440" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1180.0" y="451.0" fill="#20334D">3 → 10 → 17 → …</text><rect x="40" y="490" width="160" height="62" fill="#467A54" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="120.0" y="521.0" fill="white">4</text><rect x="200" y="490" width="380" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="390.0" y="521.0" fill="#20334D">[128, 144) KiB</text><rect x="580" y="490" width="380" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="770.0" y="521.0" fill="#20334D">[144, 160) KiB</text><rect x="960" y="490" width="440" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1180.0" y="521.0" fill="#20334D">4 → 11 → 18 → …</text><rect x="40" y="560" width="160" height="62" fill="#B25870" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="120.0" y="591.0" fill="white">5</text><rect x="200" y="560" width="380" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="390.0" y="591.0" fill="#20334D">[160, 176) KiB</text><rect x="580" y="560" width="380" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="770.0" y="591.0" fill="#20334D">[176, 192) KiB</text><rect x="960" y="560" width="440" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1180.0" y="591.0" fill="#20334D">5 → 12 → 19 → …</text><rect x="40" y="630" width="160" height="62" fill="#6475A8" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="120.0" y="661.0" fill="white">6</text><rect x="200" y="630" width="380" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="390.0" y="661.0" fill="#20334D">[192, 208) KiB</text><rect x="580" y="630" width="380" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="770.0" y="661.0" fill="#20334D">[208, 224) KiB</text><rect x="960" y="630" width="440" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1180.0" y="661.0" fill="#20334D">6 → 13 → 20 → …</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="start" x="40" y="757.5" fill="#20334D">A_smem = smem + stage_id × 32768；B_smem = A_smem + 16384</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="40" y="833.0" fill="#20334D">stage_id = iter_k % 7；各槽位只存输入。所有计算共用一个 128×128 FP32 TMEM。</text></svg>