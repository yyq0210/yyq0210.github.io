<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780"><rect x="0" y="0" width="1440" height="780" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">两份数据缓冲，三个 barrier，两个局部 phase 变量</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">每个 TMA barrier 独立维护自己的硬件状态；局部 phase 只给 wait 提供期望的阶段奇偶性。</text><rect x="40" y="160" width="660" height="105" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="370.0" y="196.3" fill="white">SMEM stage 0</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="370.0" y="228.7" fill="white">存放 tile 0、2、4…</text><line stroke-width="2" x1="370" y1="270" x2="370" y2="320" stroke="#5F7086" /><polygon points="370,320 364,310 376,310" fill="#5F7086" /><rect x="40" y="330" width="660" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="370.0" y="364.47499999999997" fill="#20334D">tma_mbars[0]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="370.0" y="395.525" fill="#20334D">报告该 stage 的 A/B 搬运完成</text><rect x="740" y="160" width="660" height="105" fill="#138A78" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1070.0" y="196.3" fill="white">SMEM stage 1</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1070.0" y="228.7" fill="white">存放 tile 1、3、5…</text><line stroke-width="2" x1="1070" y1="270" x2="1070" y2="320" stroke="#5F7086" /><polygon points="1070,320 1064,310 1076,310" fill="#5F7086" /><rect x="740" y="330" width="660" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1070.0" y="364.47499999999997" fill="#20334D">tma_mbars[1]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1070.0" y="395.525" fill="#20334D">报告该 stage 的 A/B 搬运完成</text><rect x="40" y="490" width="1360" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="720.0" y="523.125" fill="#20334D">mma_mbars[0]：报告当前一组 MMA 完成</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="720.0" y="556.875" fill="#20334D">外层每轮等待一次，所以只需要一个 MMA barrier</text><rect x="40" y="635" width="660" height="75" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="370.0" y="672.5" fill="#20334D">tma_phase：绕完所有 stage 后翻转</text><rect x="740" y="635" width="660" height="75" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1070.0" y="672.5" fill="#20334D">mma_phase：每完成一个 tile 后翻转</text></svg>