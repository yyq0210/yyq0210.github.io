<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930"><rect x="0" y="0" width="1440" height="930" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">ldmatrix.x4：先看“谁提供行地址”</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">以 warp 0、k=0、m=0、偶数 n=0 为例。每个彩色格是一张 8×8 BF16 小矩阵。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="start" x="60" y="162.5" fill="#20334D">A：一条 x4 为一个 MMA 提供 16×16</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="start" x="750" y="162.5" fill="#20334D">Bphys：一条 x4 为两个 MMA 提供 16×16</text><rect x="60" y="215" width="285" height="205" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="202.5" y="258.1" fill="#20334D">小矩阵 j=0</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="202.5" y="287.8" fill="#20334D">地址提供者 L0–L7</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="202.5" y="317.5" fill="#20334D">物理行 0–7</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="202.5" y="347.20000000000005" fill="#20334D">K 0–7</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="202.5" y="376.90000000000003" fill="#20334D">返回 packed reg 0</text><rect x="360" y="215" width="285" height="205" fill="#EEE5F4" stroke="#CCD7E4