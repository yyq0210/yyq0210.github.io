<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"><rect x="0" y="0" width="1440" height="820" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">K=256 只有 4 个 tile：固定 7-stage 不会全部用上</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">BLOCK_K=64；tile 总数由 K 决定，缓冲槽位数由 NUM_STAGES 决定。两者不必相等。</text><rect x="40" y="180" width="185" height="70" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="132.5" y="215.0" fill="white">stage 0</text><rect x="40" y="270" width="185" height="70" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="132.5" y="305.0" fill="#20334D">tile 0</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="132.5" y="392.5" fill="#5F7086">K[0:64]</text><rect x="235" y="180" width="185" height="70" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="327.5" y="215.0" fill="white">stage 1</text><rect x="235" y="270" width="185" height="70" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="327.5" y="305.0" fill="#20334D">tile 1</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="327.5" y="392.5" fill="#5F7086">K[64:128]</text><rect x="430" y="180" width="185" height="70" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="522.5" y="215.0" fill="white">stage 2</text><rect x="430" y="270" width="185" height="70" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="522.5" y="305.0" fill="#20334D">tile 2</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="522.5" y="392.5" fill="#5F7086">K[128:192]</text><rect x="625" y="180" width="185" height="70" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="717.5" y="215.0" fill="white">stage 3</text><rect x="625" y="270" width="185" height="70" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="717.5" y="305.0" fill="#20334D">tile 3</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="717.5" y="392.5" fill="#5F7086">K[192:256]</text><rect x="820" y="180" width="185" height="70" fill="#BBC5D2" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="912.5" y="215.0" fill="white">stage 4</text><rect x="820" y="270" width="185" height="70" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="912.5" y="305.0" fill="#20334D">未使用</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="912.5" y="392.5" fill="#5F7086">仍占分配空间</text><rect x="1015" y="180" width="185" height="70" fill="#BBC5D2" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1107.5" y="215.0" fill="white">stage 5</text><rect x="1015" y="270" width="185" height="70" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1107.5" y="305.0" fill="#20334D">未使用</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="1107.5" y="392.5" fill="#5F7086">仍占分配空间</text><rect x="1210" y="180" width="185" height="70" fill="#BBC5D2" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1302.5" y="215.0" fill="white">stage 6</text><rect x="1210" y="270" width="185" height="70" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1302.5" y="305.0" fill="#20334D">未使用</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="1302.5" y="392.5" fill="#5F7086">仍占分配空间</text><rect x="40" y="465" width="1360" height="75" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" dominant-baseline="central" text-anchor="middle" x="720.0" y="502.5" fill="#20334D">7 stages：224 KiB；4 stages：128 KiB；2 stages：64 KiB</text><rect x="40" y="565" width="1360" height="75" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="720.0" y="602.5" fill="#20334D">若用 2 stages：stage 0 轮流存 tile 0、2；stage 1 轮流存 tile 1、3</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="732.5" fill="#20334D">未复用 buffer 也必须等最终 MMA 完成。即使 K 很短，V4 的 F 仍保护输出读取。</text></svg>