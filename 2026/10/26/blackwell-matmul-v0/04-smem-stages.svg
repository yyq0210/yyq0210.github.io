<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"><rect x="0" y="0" width="1440" height="820" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">SMEM 的完整地址空间：3 个 stage，合计 96 KiB</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">所有数值为相对动态 SMEM 基址的字节偏移；每 stage 存一个 K=64 的 A/B tile。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="199.475" fill="#20334D">stage 0</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="230.525" fill="#20334D">base 0</text><rect x="230" y="160" width="550" height="110" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="505.0" y="183.95000000000002" fill="#20334D">A：128×64 BF16 = 16 KiB</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="505.0" y="215.00000000000003" fill="#20334D">[0, 16384)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="505.0" y="246.05" fill="#20334D">内部布局见上一图</text><rect x="810" y="160" width="550" height="110" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1085.0" y="183.95000000000002" fill="#20334D">Bphys：128×64 BF16 = 16 KiB</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1085.0" y="215.00000000000003" fill="#20334D">[16384, 32768)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1085.0" y="246.05" fill="#20334D">内部布局见上一图</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="349.47499999999997" fill="#20334D">stage 1</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="380.525" fill="#20334D">base 32768</text><rect x="230" y="310" width="550" height="110" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="505.0" y="333.95" fill="#20334D">A：128×64 BF16 = 16 KiB</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="505.0" y="365.0" fill="#20334D">[32768, 49152)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="505.0" y="396.05" fill="#20334D">内部布局见上一图</text><rect x="810" y="310" width="550" height="110" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1085.0" y="333.95" fill="#20334D">Bphys：128×64 BF16 = 16 KiB</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1085.0" y="365.0" fill="#20334D">[49152, 65536)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1085.0" y="396.05" fill="#20334D">内部布局见上一图</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="499.47499999999997" fill="#20334D">stage 2</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="530.525" fill="#20334D">base 65536</text><rect x="230" y="460" width="550" height="110" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="505.0" y="483.95" fill="#20334D">A：128×64 BF16 = 16 KiB</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="505.0" y="515.0" fill="#20334D">[65536, 81920)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="505.0" y="546.05" fill="#20334D">内部布局见上一图</text><rect x="810" y="460" width="550" height="110" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1085.0" y="483.95" fill="#20334D">Bphys：128×64 BF16 = 16 KiB</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1085.0" y="515.0" fill="#20334D">[81920, 98304)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1085.0" y="546.05" fill="#20334D">内部布局见上一图</text><rect x="40" y="650" width="1360" height="60" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="720.0" y="680.0" fill="#20334D">stage_id = iter_k mod 3；每个 stage 内，先放完整 A，再放完整 B。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="760.5" fill="#20334D">GMEM 行跨度是 K×2 字节；SMEM tile 的行跨度是 64×2=128 字节。两者不可混用。</text></svg>