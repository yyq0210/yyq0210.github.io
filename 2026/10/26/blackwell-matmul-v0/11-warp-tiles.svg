" text-anchor="middle" x="955.0" y="435.0" fill="#20334D">acc[2][5]</text><rect x="1030" y="390" width="150" height="90" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="1105.0" y="435.0" fill="#20334D">acc[2][6]</text><rect x="1180" y="390" width="150" height="90" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="1255.0" y="435.0" fill="#20334D">acc[2][7]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="81.0" y="525.0" fill="#5F7086">m=3</text><rect x="130" y="480" width="150" height="90" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="205.0" y="525.0" fill="#20334D">acc[3][0]</text><rect x="280" y="480" width="150" height="90" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="355.0" y="525.0" fill="#20334D">acc[3][1]</text><rect x="430" y="480" width="150" height="90" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="505.0" y="525.0" fill="#20334D">acc[3][2]</text><rect x="580" y="480" width="150" height="90" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="655.0" y="525.0" fill="#20334D">acc[3][3]</text><rect x="730" y="480" width="150" height="90" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="805.0" y="525.0" fill="#20334D">acc[3][4]</text><rect x="880" y="480" width="150" height="90" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="955.0" y="525.0" fill="#20334D">acc[3][5]</text><rect x="1030" y="480" width="150" height="90" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="1105.0" y="525.0" fill="#20334D">acc[3][6]</text><rect x="1180" y="480" width="150" height="90" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="1255.0" y="525.0" fill="#20334D">acc[3][7]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="start" x="40" y="627.5" fill="#20334D">每格内部都是上一图的 32-lane 排列。每个 lane 在每格持有 4 个 FP32。</text><rect x="40" y="675" width="1360" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="720.0" y="707.5" fill="#20334D">每线程：32 子块 × 4 = 128 个输出；每 block：128 线程 × 128 = 16,384 个输出。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="797.5" fill="#20334D">每轮 K=64 分成 4 个 K=16：每 warp 执行 4×4×8=128 条 warp 级 MMA 指令。</text></svg>