<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><rect x="0" y="0" width="1440" height="760" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">Block 与 warp：谁控制硬件，谁搬出结果？</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">例如 M=N=4096：grid_m=32，grid_n=16，共 512 个 block；每个 block 有 128 个线程。</text><rect x="40" y="185" width="145" height="68" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="112.5" y="219.0" fill="white">bid=0</text><rect x="195" y="185" width="145" height="68" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="267.5" y="219.0" fill="white">bid=1</text><rect x="350" y="185" width="145" height="68" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="422.5" y="219.0" fill="white">bid=2</text><rect x="505" y="185" width="145" height="68" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="577.5" y="219.0" fill="white">…</text><rect x="40" y="265" width="145" height="68" fill="#138A78" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="112.5" y="299.0" fill="white">bid=16</text><rect x="195" y="265" width="145" height="68" fill="#138A78" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="267.5" y="299.0" fill="white">bid=17</text><rect x="350" y="265" width="145" height="68" fill="#138A78" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="422.5" y="299.0" fill="white">bid=18</text><rect x="505" y="265" width="145" height="68" fill="#138A78" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="577.5" y="299.0" fill="white">…</text><rect x="40" y="345" width="145" height="68" fill="#9A65A8" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="112.5" y="379.0" fill="white">bid=32</text><rect x="195" y="345" width="145" height="68" fill="#9A65A8" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="267.5" y="379.0" fill="white">bid=33</text><rect x="350" y="345" width="145" height="68" fill="#9A65A8" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="422.5" y="379.0" fill="white">bid=34</text><rect x="505" y="345" width="145" height="68" fill="#9A65A8" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="577.5" y="379.0" fill="white">…</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="469.0" fill="#20334D">每格：输出 C 的 128×256 区域</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="40" y="527.0" fill="#20334D">bid_m = bid / grid_n</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="40" y="572.0" fill="#20334D">bid_n = bid % grid_n</text><rect x="735" y="160" width="665" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1067.5" y="195.15" fill="#20334D">warp 0 选出的一个线程</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1067.5" y="224.85" fill="#20334D">初始化 barrier；发起 TMA / MMA / commit</text><rect x="735" y="284" width="665" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1067.5" y="319.15000000000003" fill="#20334D">warp 1 全部 32 个线程</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1067.5" y="348.85" fill="#20334D">协同分配 TMEM</text><rect x="735" y="408" width="665" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1067.5" y="443.15000000000003" fill="#20334D">全部四个 warp</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1067.5" y="472.85" fill="#20334D">等待；读取 TMEM；写回各自行</text><rect x="735" y="532" width="665" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1067.5" y="567.15" fill="#20334D">warp 0 全部 32 个线程</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1067.5" y="596.85" fill="#20334D">在所有读取结束后释放 TMEM</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="start" x="40" y="701.0" fill="#20334D">不是每个线程独立计算一块 GEMM：一个 elected thread 发指令，Tensor Core 执行整块 MMA。</text></svg>