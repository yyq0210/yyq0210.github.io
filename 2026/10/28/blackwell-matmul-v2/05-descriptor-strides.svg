4" y="245" width="64" height="38" fill="#467A54" stroke="white" /><rect x="1182" y="245" width="64" height="38" fill="#B25870" stroke="white" /><rect x="1250" y="245" width="64" height="38" fill="#6475A8" stroke="white" /><rect x="1318" y="245" width="64" height="38" fill="#727B86" stroke="white" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="start" x="750" y="311.0" fill="#20334D">row 1</text><rect x="842" y="292" width="64" height="38" fill="#138A78" stroke="white" /><rect x="910" y="292" width="64" height="38" fill="#276EA4" stroke="white" /><rect x="978" y="292" width="64" height="38" fill="#C47527" stroke="white" /><rect x="1046" y="292" width="64" height="38" fill="#9A65A8" stroke="white" /><rect x="1114" y="292" width="64" height="38" fill="#B25870" stroke="white" /><rect x="1182" y="292" width="64" height="38" fill="#467A54" stroke="white" /><rect x="1250" y="292" width="64" height="38" fill="#727B86" stroke="white" /><rect x="1318" y="292" width="64" height="38" fill="#6475A8" stroke="white" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="start" x="750" y="358.0" fill="#20334D">…</text><rect x="842" y="339" width="64" height="38" fill="#9A65A8" stroke="white" /><rect x="910" y="339" width="64" height="38" fill="#C47527" stroke="white" /><rect x="978" y="339" width="64" height="38" fill="#276EA4" stroke="white" /><rect x="1046" y="339" width="64" height="38" fill="#138A78" stroke="white" /><rect x="1114" y="339" width="64" height="38" fill="#6475A8" stroke="white" /><rect x="1182" y="339" width="64" height="38" fill="#727B86" stroke="white" /><rect x="1250" y="339" width="64" height="38" fill="#467A54" stroke="white" /><rect x="1318" y="339" width="64" height="38" fill="#B25870" stroke="white" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="start" x="750" y="405.0" fill="#20334D">row 7</text><rect x="842" y="386" width="64" height="38" fill="#727B86" stroke="white" /><rect x="910" y="386" width="64" height="38" fill="#6475A8" stroke="white" /><rect x="978" y="386" width="64" height="38" fill="#B25870" stroke="white" /><rect x="1046" y="386" width="64" height="38" fill="#467A54" stroke="white" /><rect x="1114" y="386" width="64" height="38" fill="#C47527" stroke="white" /><rect x="1182" y="386" width="64" height="38" fill="#9A65A8" stroke="white" /><rect x="1250" y="386" width="64" height="38" fill="#138A78" stroke="white" /><rect x="1318" y="386" width="64" height="38" fill="#276EA4" stroke="white" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="start" x="750" y="452.0" fill="#20334D">row 8</text><rect x="842" y="433" width="64" height="38" fill="#276EA4" stroke="white" /><rect x="910" y="433" width="64" height="38" fill="#138A78" stroke="white" /><rect x="978" y="433" width="64" height="38" fill="#9A65A8" stroke="white" /><rect x="1046" y="433" width="64" height="38" fill="#C47527" stroke="white" /><rect x="1114" y="433" width="64" height="38" fill="#467A54" stroke="white" /><rect x="1182" y="433" width="64" height="38" fill="#B25870" stroke="white" /><rect x="1250" y="433" width="64" height="38" fill="#6475A8" stroke="white" /><rect x="1318" y="433" width="64" height="38" fill="#727B86" stroke="white" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="start" x="750" y="499.0" fill="#20334D">…</text><rect x="842" y="480" width="64" height="38" fill="#138A78" stroke="white" /><rect x="910" y="480" width="64" height="38" fill="#276EA4" stroke="white" /><rect x="978" y="480" width="64" height="38" fill="#C47527" stroke="white" /><rect x="1046" y="480" width="64" height="38" fill="#9A65A8" stroke="white" /><rect x="1114" y="480" width="64" height="38" fill="#B25870" stroke="white" /><rect x="1182" y="480" width="64" height="38" fill="#467A54" stroke="white" /><rect x="1250" y="480" width="64" height="38" fill="#727B86" stroke="white" /><rect x="1318" y="480" width="64" height="38" fill="#6475A8" stroke="white" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="start" x="750" y="546.0" fill="#20334D">row127</text><rect x="842" y="527" width="64" height="38" fill="#727B86" stroke="white" /><rect x="910" y="527" width="64" height="38" fill="#6475A8" stroke="white" /><rect x="978" y="527" width="64" height="38" fill="#B25870" stroke="white" /><rect x="1046" y="527" width="64" height="38" fill="#467A54" stroke="white" /><rect x="1114" y="527" width="64" height="38" fill="#C47527" stroke="white" /><rect x="1182" y="527" width="64" height="38" fill="#9A65A8" stroke="white" /><rect x="1250" y="527" width="64" height="38" fill="#138A78" stroke="white" /><rect x="1318" y="527" width="64" height="38" fill="#276EA4" stroke="white" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="750" y="632.0" fill="#20334D">一行含 8 个 16B 小包；物理位置由 swizzle 决定。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="start" x="750" y="684.0" fill="#20334D">K-major swizzled 模式不使用 LBO 字段。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="start" x="750" y="724.0" fill="#20334D">SBO：row 0 → row 8 = 8×128 = 1024B</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="start" x="40" y="819.0" fill="#20334D">SBO 是跨 8 行的距离，不是整个切片大小。v2 的 A 切片大小是 H×128 = 16384B。</text></svg>