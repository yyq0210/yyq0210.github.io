<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950"><rect x="0" y="0" width="1440" height="950" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">09｜TMEM → 寄存器 → GMEM：同一列按 lane 分发</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">SM100_TMEM_LOAD_32dp32b1x：一个 warp 一次读 32 行 × 1 列，每个 lane 得到 1 个 FP32。</text><rect x="40" y="205" width="410" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="245.0" y="237.5" fill="#20334D">TMEM row=32, col=69</text><line stroke-width="2" x1="450" y1="237" x2="505" y2="237" stroke="#5F7086" /><polygon points="505,237 495.0,231.0 495.0,243.0" fill="#5F7086" /><rect x="505" y="205" width="405" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="707.5" y="223.32500000000002" fill="#20334D">warp 1 · lane 0</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="707.5" y="251.675" fill="#20334D">tid=32 的 rAcc[69]</text><line stroke-width="2" x1="910" y1="237" x2="965" y2="237" stroke="#5F7086" /><polygon points="965,237 955.0,231.0 955.0,243.0" fill="#5F7086" /><rect x="965" y="205" width="410" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1170.0" y="237.5" fill="#20334D">D[32,69]</text><rect x="40" y="295" width="410" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="245.0" y="327.5" fill="#20334D">TMEM row=33, col=69</text><line stroke-width="2" x1="450" y1="327" x2="505" y2="327" stroke="#5F7086" /><polygon points="505,327 495.0,321.0 495.0,333.0" fill="#5F7086" /><rect x="505" y="295" width="405" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="707.5" y="313.325" fill="#20334D">warp 1 · lane 1</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="707.5" y="341.675" fill="#20334D">tid=33 的 rAcc[69]</text><line stroke-width="2" x1="910" y1="327" x2="965" y2="327" stroke="#5F7086" /><polygon points="965,327 955.0,321.0 955.0,333.0" fill="#5F7086" /><rect x="965" y="295" width="410" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1170.0" y="327.5" fill="#20334D">D[33,69]</text><rect x="40" y="385" width="410" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="245.0" y="417.5" fill="#20334D">TMEM row=37, col=69</text><line stroke-width="2" x1="450" y1="417" x2="505" y2="417" stroke="#5F7086" /><polygon points="505,417 495.0,411.0 495.0,423.0" fill="#5F7086" /><rect x="505" y="385" width="405" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="707.5" y="403.325" fill="#20334D">warp 1 · lane 5</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="707.5" y="431.675" fill="#20334D">tid=37 的 rAcc[69]</text><line stroke-width="2" x1="910" y1="417" x2="965" y2="417" stroke="#5F7086" /><polygon points="965,417 955.0,411.0 955.0,423.0" fill="#5F7086" /><rect x="965" y="385" width="410" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1170.0" y="417.5" fill="#20334D">D[37,69]</text><rect x="40" y="475" width="410" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="245.0" y="507.5" fill="#20334D">TMEM row=63, col=69</text><line stroke-width="2" x1="450" y1="507" x2="505" y2="507" stroke="#5F7086" /><polygon points="505,507 495.0,501.0 495.0,513.0" fill="#5F7086" /><rect x="505" y="475" width="405" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="707.5" y="493.325" fill="#20334D">warp 1 · lane 31</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="707.5" y="521.675" fill="#20334D">tid=63 的 rAcc[69]</text><line stroke-width="2" x1="910" y1="507" x2="965" y2="507" stroke="#5F7086" /><polygon points="965,507 955.0,501.0 955.0,513.0" fill="#5F7086" /><rect x="965" y="475" width="410" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1170.0" y="507.5" fill="#20334D">D[63,69]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="start" x="45" y="632.5" fill="#20334D">一次 warp 指令：各 lane 使用相同的 warp 起点地址；硬件按 lane 分配各自的 row。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="start" x="45" y="692.5" fill="#20334D">重复列 n=0…255 → 每线程逻辑上持有一行的 256 个结果。</text><rect x="45" y="755" width="645" height="110" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="367.5" y="794.475" fill="#20334D">线程连续：tid=32,33,…63</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="367.5" y="825.525" fill="#20334D">固定列写 D 时，GMEM 地址间隔 N×4 字节</text><rect x="735" y="755" width="645" height="110" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1057.5" y="794.475" fill="#20334D">线程内连续：rAcc[0],rAcc[1],…</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1057.5" y="825.525" fill="#20334D">不代表相邻线程写的是相邻 GMEM 地址</text></svg>