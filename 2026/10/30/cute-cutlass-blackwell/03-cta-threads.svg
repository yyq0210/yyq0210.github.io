ral" text-anchor="middle" x="120.0" y="452.5" fill="#20334D">CTA(3,0)</text><rect x="200" y="415" width="160" height="75" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="280.0" y="452.5" fill="#20334D">CTA(3,1)</text><rect x="360" y="415" width="160" height="75" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="440.0" y="452.5" fill="#20334D">CTA(3,2)</text><rect x="520" y="415" width="160" height="75" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="600.0" y="452.5" fill="#20334D">CTA(3,3)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="55" y="553.9499999999999" fill="#20334D">blockIdx.x → M 分块</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="55" y="584.9999999999999" fill="#20334D">blockIdx.y → N 分块</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="55" y="616.05" fill="#20334D">每个 CTA 独自遍历完整 K。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="start" x="760" y="155.0" fill="#20334D">一个 CTA：blockDim = 128</text><rect x="760" y="190" width="145" height="65" fill="#D6E9FA" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="832.5" y="222.5" fill="#20334D">warp 0</text><rect x="915" y="190" width="470" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" d