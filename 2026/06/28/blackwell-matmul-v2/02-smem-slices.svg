 sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1070.0" y="504.85" fill="white">128 行 × 128B = 16384B；行内小包重排</text><rect x="750" y="558" width="640" height="96" fill="#C47527" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1070.0" y="591.15" fill="white">切片 3 · K[192:256]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1070.0" y="620.85" fill="white">128 行 × 128B = 16384B；行内小包重排</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="722.0" fill="#20334D">基础索引：[32][128][8]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="750" y="722.0" fill="#20334D">重排前的基础索引：[4][128][64]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="start" x="40" y="795.0" fill="#20334D">v1 两个窄切片供一次 MMA；v2 一个宽切片供四次 MMA。两者总计都是 16 次 MMA。</text></svg>