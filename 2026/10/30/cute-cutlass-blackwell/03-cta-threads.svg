ntral" text-anchor="start" x="760" y="585.0000000000001" fill="#20334D">发起 MMA：warp 0 调用，内部选 1 个 lane 发指令</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="760" y="614.7" fill="#20334D">读回 TMEM：全部 128 个线程</text><rect x="40" y="725" width="640" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="360.0" y="760.15" fill="#20334D">get_slice(mma_v=0)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="360.0" y="789.85" fill="#20334D">选择 peer CTA 0，不是 CUDA 线程 0</text><rect x="760" y="725" width="630" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1075.0" y="760.15" fill="#20334D">copy.get_slice(threadIdx.x)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1075.0" y="789.85" fill="#20334D">这里才是选择实际 CUDA 线程</text></svg>