<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030"><rect x="0" y="0" width="1440" height="1030" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">11｜Simple UMMA 的时序：异步计算，但没有跨 K tile 的加载重叠</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">横轴为示意时间，不表示真实耗时。画出前两轮；后两轮重复相同依赖。只有一份 A/B SMEM。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="35" y="235.0" fill="#20334D">128 线程搬入</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="35" y="330.0" fill="#20334D">CTA 同步</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="35" y="425.0" fill="#20334D">warp 0 发指令</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="35" y="520.0" fill="#20334D">Tensor Core</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="35" y="615.0" fill="#20334D">完成等待</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="35" y="710.0" fill="#20334D">SMEM 生命周期</text><line stroke-width="2" x1="260" y1="190" x2="1380" y2="190" stroke="#5F7086" /><polygon points="1380,190 1370.0,184.0 1370.0,196.0" fill="#5F7086" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="start" x="260" y="160.0" fill="#20334D">t=0 / K=0…63</text><rect x="260" y="205" width="140" height="60" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="330.0" y="235.0" fill="#20334D">copy A/B</text><rect x="405" y="300" width="60" height="60" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="435.0" y="330.0" fill="#20334D">同步</text><rect x="470" y="395" width="150" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="545.0" y="413.325" fill="#20334D">4 MMA</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="545.0" y="441.675" fill="#20334D">+ commit</text><rect x="485" y="490" width="240" height="60" fill="#DDEFE8" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="605.0" y="520.0" fill="#20334D">异步执行 4 MMA</text><rect x="535" y="585" width="240" height="60" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="655.0" y="615.0" fill="#20334D">wait phase 0 → 返回</text><rect x="470" y="680" width="250" height="60" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="595.0" y="710.0" fill="#20334D">MMA 在读，禁止覆盖</text><line stroke-width="2" x1="330" y1="265" x2="435" y2="300" stroke="#5F7086" /><polygon points="435,300 427.4105336155959,291.1456225515285 423.6158004233938,302.5298221281347" fill="#5F7086" /><line stroke-width="2" x1="435" y1="360" x2="500" y2="395" stroke="#5F7086" /><polygon points="500,395 494.03988793898833,384.9761751701168 488.35069006256816,395.5418283691829" fill="#5F7086" /><line stroke-width="2" x1="550" y1="460" x2="550" y2="490" stroke="#5F7086" /><polygon points="550,490 556.0,480.0 544.0,480.0" fill="#5F7086" /><line stroke-width="2" x1="725" y1="550" x2="725" y2="585" stroke="#5F7086" /><polygon points="725,585 731.0,575.0 719.0,575.0" fill="#5F7086" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="start" x="640" y="569.0" fill="#20334D">完成</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="start" x="820" y="160.0" fill="#20334D">t=1 / K=64…127</text><rect x="820" y="205" width="140" height="60" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="890.0" y="235.0" fill="#20334D">copy A/B</text><rect x="965" y="300" width="60" height="60" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="995.0" y="330.0" fill="#20334D">同步</text><rect x="1030" y="395" width="150" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1105.0" y="413.325" fill="#20334D">4 MMA</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1105.0" y="441.675" fill="#20334D">+ commit</text><rect x="1045" y="490" width="240" height="60" fill="#DDEFE8" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1165.0" y="520.0" fill="#20334D">异步执行 4 MMA</text><rect x="1095" y="585" width="240" height="60" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1215.0" y="615.0" fill="#20334D">wait phase 1 → 返回</text><rect x="1030" y="680" width="250" height="60" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1155.0" y="710.0" fill="#20334D">MMA 在读，禁止覆盖</text><line stroke-width="2" x1="890" y1="265" x2="995" y2="300" stroke="#5F7086" /><polygon points="995,300 987.4105336155959,291.1456225515285 983.6158004233938,302.5298221281347" fill="#5F7086" /><line stroke-width="2" x1="995" y1="360" x2="1060" y2="395" stroke="#5F7086" /><polygon points="1060,395 1054.0398879389884,384.9761751701168 1048.3506900625682,395.5418283691829" fill="#5F7086" /><line stroke-width="2" x1="1110" y1="460" x2="1110" y2="490" stroke="#5F7086" /><polygon points="1110,490 1116.0,480.0 1104.0,480.0" fill="#5F7086" /><line stroke-width="2" x1="1285" y1="550" x2="1285" y2="585" stroke="#5F7086" /><polygon points="1285,585 1291.0,575.0 1279.0,575.0" fill="#5F7086" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="start" x="1200" y="569.0" fill="#20334D">完成</text><line stroke-width="2" x1="775" y1="615" x2="800" y2="615" stroke="#5F7086" /><polygon points="800,615 790.0,609.0 790.0,621.0" fill="#5F7086" /><line stroke-width="2" x1="800" y1="615" x2="800" y2="235" stroke="#5F7086" /><polygon points="800,235 794.0,245.0 806.0,245.0" fill="#5F7086" /><line stroke-width="2" x1="800" y1="235" x2="820" y2="235" stroke="#5F7086" /><polygon points="820,235 810.0,229.0 810.0,241.0" fill="#5F7086" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="start" x="45" y="812.5" fill="#20334D">t=0 的完成等待返回后，才能开始右侧 t=1 的 copy。t=2、t=3 同理。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="45" y="891.975" fill="#20334D">一个 barrier 的 arrival count=1；128 个线程等待同一完成事件。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="45" y="923.025" fill="#20334D">phase：0 → 1 → 0 → 1，不是 buffer 编号。最后一轮 wait 后再读回 TMEM。</text></svg>