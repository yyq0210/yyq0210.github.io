<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect x="0" y="0" width="1440" height="900" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">V3 与 V4：等待放在不同位置</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">V3 图按实际双缓冲表示；V4 图表达独立生产/消费循环，并不按相同 tile 耗时比较。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" dominant-baseline="central" text-anchor="start" x="40" y="167.5" fill="#20334D">V3：同一轮控制流程，在末尾等待当前 MMA</text><rect x="40" y="215" width="320" height="85" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="200.0" y="257.5" fill="white">发起 L(i+1)</text><line stroke-width="2" x1="365" y1="257" x2="379" y2="257" stroke="#5F7086" /><polygon points="379,257 369,251 369,263" fill="#5F7086" /><rect x="385" y="215" width="320" height="85" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="545.0" y="257.5" fill="#20334D">等 T(i)，提交 C(i)</text><line stroke-width="2" x1="710" y1="257" x2="724" y2="257" stroke="#5F7086" /><polygon points="724,257 714,251 714,263" fill="#5F7086" /><rect x="730" y="215" width="320" height="85" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="890.0" y="257.5" fill="#20334D">等待 C(i) 完成</text><line stroke-width="2" x1="1055" y1="257" x2="1069" y2="257" stroke="#5F7086" /><polygon points="1069,257 1059,251 1059,263" fill="#5F7086" /><rect x="1075" y="215" width="320" height="85" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1235.0" y="257.5" fill="#20334D">下一轮：L(i+2)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="356.0" fill="#20334D">覆盖旧槽位之前，上一次循环已经等完旧计算。load 内不用重复等待。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" dominant-baseline="central" text-anchor="start" x="40" y="464.0" fill="#20334D">V4：两个 warp 独立推进，只在各自的数据依赖处等待</text><rect x="40" y="530" width="220" height="80" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="150.0" y="570.0" fill="white">TMA warp</text><rect x="300" y="530" width="410" height="80" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="505.0" y="570.0" fill="#20334D">等目标槽位的旧 MMA</text><rect x="750" y="530" width="650" height="80" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1075.0" y="570.0" fill="#20334D">提交新 TMA → 尝试下个槽位</text><rect x="40" y="650" width="220" height="80" fill="#138A78" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="150.0" y="690.0" fill="white">MMA warp</text><rect x="300" y="650" width="410" height="80" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="505.0" y="690.0" fill="#20334D">等当前槽位的新 TMA</text><rect x="750" y="650" width="650" height="80" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1075.0" y="690.0" fill="#20334D">提交 MMA + commit → 尝试下一轮</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="start" x="40" y="822.5" fill="#20334D">V4 没有每轮末尾的 MMA wait；对应等待移到了复用该槽位的 TMA 端。</text></svg>