<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790"><rect x="0" y="0" width="1440" height="790" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">覆盖旧数据前，必须确认之前的 MMA 已经读完</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">源码在每轮 compute 后等待 MMA 完成，随后才能进入下一轮 load。</text><rect x="40" y="150" width="185" height="58" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="132.5" y="179.0" fill="#20334D">阶段</text><rect x="225" y="150" width="350" height="58" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="400.0" y="179.0" fill="#20334D">发起未来搬运</text><rect x="575" y="150" width="500" height="58" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="825.0" y="179.0" fill="#20334D">消费当前数据</text><rect x="1075" y="150" width="305" height="58" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1227.5" y="179.0" fill="#20334D">完成后的状态</text><rect x="40" y="210" width="185" height="97" fill="#F2F6FA" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="132.5" y="258.5" fill="#20334D">预取</text><rect x="225" y="210" width="350" height="97" fill="#F2F6FA" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="400.0" y="258.5" fill="#20334D">load(0) → stage 0</text><rect x="575" y="210" width="500" height="97" fill="#F2F6FA" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="825.0" y="258.5" fill="#20334D">尚未计算</text><rect x="1075" y="210" width="305" height="97" fill="#F2F6FA" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="1227.5" y="258.5" fill="#20334D">初始槽位为空</text><rect x="40" y="313" width="185" height="97" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="132.5" y="361.5" fill="#20334D">主循环 i=0</text><rect x="225" y="313" width="350" height="97" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="400.0" y="361.5" fill="#20334D">load(1) → stage 1</text><rect x="575" y="313" width="500" height="97" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="825.0" y="361.5" fill="#20334D">MMA(0) 读 stage 0；等待完成</text><rect x="1075" y="313" width="305" height="97" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="1227.5" y="361.5" fill="#20334D">stage 0 此后可复用</text><rect x="40" y="416" width="185" height="97" fill="#F2F6FA" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="132.5" y="464.5" fill="#20334D">主循环 i=1</text><rect x="225" y="416" width="350" height="97" fill="#F2F6FA" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="400.0" y="464.5" fill="#20334D">load(2) → stage 0</text><rect x="575" y="416" width="500" height="97" fill="#F2F6FA" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="825.0" y="464.5" fill="#20334D">MMA(1) 读 stage 1；等待完成</text><rect x="1075" y="416" width="305" height="97" fill="#F2F6FA" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="1227.5" y="464.5" fill="#20334D">stage 1 此后可复用</text><rect x="40" y="519" width="185" height="97" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="132.5" y="567.5" fill="#20334D">主循环 i=2</text><rect x="225" y="519" width="350" height="97" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="400.0" y="567.5" fill="#20334D">load(3) → stage 1</text><rect x="575" y="519" width="500" height="97" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="825.0" y="567.5" fill="#20334D">MMA(2) 读 stage 0；等待完成</text><rect x="1075" y="519" width="305" height="97" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="1227.5" y="567.5" fill="#20334D">stage 0 此后可复用</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="40" y="697.5" fill="#20334D">load(2) 写 stage 0 之前，wait(MMA 0) 已通过。不能删掉这个等待后继续按原顺序复用。</text></svg>