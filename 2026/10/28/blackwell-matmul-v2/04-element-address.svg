<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="750" viewBox="0 0 1440 750"><rect x="0" y="0" width="1440" height="750" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">跟踪同一个元素 A[1,10]：从逻辑坐标到 SMEM 地址</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">偏移均为字节，实际地址 = A_smem + 偏移。m、k 是当前 tile 内的元素坐标。</text><rect x="40" y="150" width="1360" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="720.0" y="181.0" fill="#20334D">v1：切片宽 8 个 BF16</text><rect x="40" y="240" width="430" height="126" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="255.0" y="273.3" fill="#20334D">切片 1</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="255.0" y="303.0" fill="#20334D">10 / 8 = 1</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="255.0" y="332.70000000000005" fill="#20334D">1×128×16 = 2048B</text><rect x="500" y="240" width="430" height="126" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="715.0" y="273.3" fill="#20334D">行 1</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="715.0" y="303.0" fill="#20334D">m = 1</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="715.0" y="332.70000000000005" fill="#20334D">1×16 = 16B</text><rect x="960" y="240" width="430" height="126" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1175.0" y="273.3" fill="#20334D">行内元素 2</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1175.0" y="303.0" fill="#20334D">10 % 8 = 2</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1175.0" y="332.70000000000005" fill="#20334D">2×2 = 4B</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" dominant-baseline="central" text-anchor="start" x="40" y="402.0" fill="#20334D">offset_v1 = 2048 + 16 + 4 = 2068B</text><rect x="40" y="452" width="1360" height="62" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="720.0" y="483.0" fill="#20334D">v2：切片宽 64 个 BF16，并重排小包</text><rect x="40" y="540" width="430" height="126" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="255.0" y="574.65" fill="#20334D">切片 0 / 行 1</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="255.0" y="603.0" fill="#20334D">10 / 64 = 0</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="255.0" y="631.35" fill="#20334D">0 + 1×128 = 128B</text><rect x="500" y="540" width="430" height="126" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="715.0" y="574.65" fill="#20334D">逻辑包 1 → 物理包 0</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="715.0" y="603.0" fill="#20334D">pack = 1，行号 = 1</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="715.0" y="631.35" fill="#20334D">1 XOR 1 = 0 → 0B</text><rect x="960" y="540" width="430" height="126" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1175.0" y="574.65" fill="#20334D">包内元素 2</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1175.0" y="603.0" fill="#20334D">inner = 10 % 8 = 2</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1175.0" y="631.35" fill="#20334D">2×2 = 4B</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" dominant-baseline="central" text-anchor="start" x="40" y="706.0" fill="#20334D">offset_v2 = 128 + 0 + 4 = 132B</text></svg>