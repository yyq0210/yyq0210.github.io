y="325.0" fill="#20334D">warp 1 读回的 32×256 个结果</text><rect x="790" y="290" width="570" height="70" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1075.0" y="325.0" fill="#20334D">本例结果未使用</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="start" x="35" y="412.5" fill="#20334D">行 64…95</text><rect x="205" y="370" width="570" height="70" fill="#E9DDF3" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="490.0" y="405.0" fill="#20334D">warp 2 读回的 32×256 个结果</text><rect x="790" y="370" width="570" height="70" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1075.0" y="405.0" fill="#20334D">本例结果未使用</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="start" x="35" y="492.5" fill="#20334D">行 96…127</text><rect x="205" y="450" width="570" height="70" fill="#F8E4CC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="490.0" y="485.0" fill="#20334D">warp 3 读回的 32×256 个结果</text><rect x="790" y="450" width="570" height="70" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1075.0" y="485.0" fill="#20334D">本例结果未使用</text><rect x="50" y="610" width="630" height="110" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="365.0" y="648.125" fill="#20334D">TMEM encoded address</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="365.0" y="681.875" fill="#20334D">base + (row &lt;&lt; 16) + column</text><rect x="740" y="610" width="630" height="110" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="1055.0" y="648.125" fill="#20334D">Acc[37,69]，假设 base=0</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="1055.0" y="681.875" fill="#20334D">0x0025_0045</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="50" y="787.65" fill="#20334D">stride=65536 是“行号编码位移”，不是每行间隔 65536 字节。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="50" y="817.35" fill="#20334D">TMEM 的物理寻址规则 ≠ GMEM 的 row-major 地址公式；上图是硬件可见行列，不是芯片晶体管平面图。</text></svg>