<g font-family="Microsoft YaHei, Noto Sans SC, sans-serif">
<text x="62" y="72" font-size="34" font-weight="700" fill="#1B3A5C">图 2  四类 Attention block：分开看 KV 来源与路由来源</text>
<text x="62" y="112" font-size="18" fill="#5B6B7C">所有层都新算自己的 Main Q、局部 SWA KV、Attention 输出与 MoE；共享 Global KV 不等于整层复用。</text>
<g transform="translate(36,160)">
