<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100"><rect x="0" y="0" width="1440" height="1100" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">同一轮里的两个 block barrier，分别保护什么？</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">i 为稳态循环编号；同一批 128 个线程既提交复制，也执行 ldmatrix 和 MMA。</text><rect x="40" y="145" width="590" height="95" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="335.0" y="192.5" fill="#20334D">① __syncthreads()</text><rect x="650" y="145" width="750" height="95" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1025.0" y="192.5" fill="#20334D">全 block 已走完上一轮 compute；允许开始复用旧槽位。</text><line stroke-width="2" x1="335" y1="240" x2="335" y2="275" stroke="#5F7086" /><polygon points="335,275 329,265 341,265" fill="#5F7086" /><rect x="40" y="280" width="590" height="95" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="335.0" y="327.5" fill="#20334D">② load_AB(i+2) + commit</text><rect x="650" y="280" width="750" height="95" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1025.0" y="327.5" fill="#20334D">提交未来 tile 的 A/B 复制；线程不在这里等待它完成。</text><line stroke-width="2" x1="335" y1="375" x2="335" y2="410" stroke="#5F7086" /><polygon points="335,410 329,400 341,400" fill="#5F7086" /><rect x="40" y="415" width="590" height="95" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="335.0" y="462.5" fill="#20334D">③ cp.async.wait_group 2</text><rect x="650" y="415" width="750" height="95" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1025.0" y="462.5" fill="#20334D">每个线程等自己的较旧复制组；本轮 tile i 的复制因此完成。</text><line stroke-width="2" x1="335" y1="510" x2="335" y2="545" stroke="#5F7086" /><polygon points="335,545 329,535 341,535" fill="#5F7086" /><rect x="40" y="550" width="590" height="95" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="335.0" y="597.5" fill="#20334D">④ __syncthreads()</text><rect x="650" y="550" width="750" height="95" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1025.0" y="597.5" fill="#20334D">所有线程都完成自己的等待；之后才能跨线程读取整块 A/B。</text><line stroke-width="2" x1="335" y1="645" x2="335" y2="680" stroke="#5F7086" /><polygon points="335,680 329,670 341,670" fill="#5F7086" /><rect x="40" y="685" width="590" height="95" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="335.0" y="732.5" fill="#20334D">⑤ compute(i)：ldmatrix → MMA</text><rect x="650" y="685" width="750" height="95" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1025.0" y="732.5" fill="#20334D">读取当前槽位并计算；未来 tile 的复制可以与本轮计算重叠。</text><line stroke-width="2" x1="335" y1="780" x2="335" y2="815" stroke="#5F7086" /><polygon points="335,815 329,805 341,805" fill="#5F7086" /><rect x="40" y="820" width="590" height="95" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="335.0" y="867.5" fill="#20334D">⑥ 下一轮的 __syncthreads()</text><rect x="650" y="820" width="750" height="95" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1025.0" y="867.5" fill="#20334D">再次对齐全 block 的进度，为后续槽位复用建立边界。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="1002.5" fill="#20334D">wait_group 管本线程发出的异步复制；__syncthreads 管 block 内线程之间的同步。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="40" y="1055.0" fill="#20334D">V0 使用 cp.async group；这里没有 mbarrier 对象，也没有 producer / consumer warp 分工。</text></svg>