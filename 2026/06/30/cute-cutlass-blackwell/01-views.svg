<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"><rect x="0" y="0" width="1440" height="820" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">01｜Layout 是坐标函数；Tensor 把函数接到一块存储上</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">先确定问的是“哪个数学元素”，再问“它在哪里”或者“谁负责访问它”。</text><rect x="495" y="145" width="450" height="64" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="720.0" y="177.0" fill="#20334D">逻辑元素：A[m, k]</text><line stroke-width="2" x1="720" y1="210" x2="255" y2="295" stroke="#5F7086" /><polygon points="255,295 265.9158993380103,299.10403967359304 263.7581052828222,287.2996369010935" fill="#5F7086" /><rect x="40" y="295" width="430" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="255.0" y="330.15000000000003" fill="#20334D">GMEM 视角</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="255.0" y="359.85" fill="#20334D">全局坐标 → 字节地址</text><line stroke-width="2" x1="720" y1="210" x2="720" y2="295" stroke="#5F7086" /><polygon points="720,295 726.0,285.0 714.0,285.0" fill="#5F7086" /><rect x="505" y="295" width="430" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="720.0" y="330.15000000000003" fill="#20334D">SMEM 视角</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="720.0" y="359.85" fill="#20334D">局部坐标 → swizzle 地址</text><line stroke-width="2" x1="720" y1="210" x2="1185" y2="295" stroke="#5F7086" /><polygon points="1185,295 1176.2418947171777,287.2996369010935 1174.0841006619899,299.10403967359304" fill="#5F7086" /><rect x="970" y="295" width="430" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1185.0" y="330.15000000000003" fill="#20334D">线程 / TV 视角</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1185.0" y="359.85" fill="#20334D">参与者 + 值编号 → 逻辑坐标</text><rect x="40" y="485" width="430" height="90" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="255.0" y="515.8249999999999" fill="#20334D">MMA 视角</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="255.0" y="544.175" fill="#20334D">A 的 K16 子块 × B 的 K16 子块</text><line stroke-width="2" x1="720" y1="395" x2="255" y2="485" stroke="#5F7086" /><polygon points="255,485 265.957929945298,488.99046003788305 263.67766706650764,477.2091018307997" fill="#5F7086" /><rect x="505" y="485" width="430" height="90" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="720.0" y="515.8249999999999" fill="#20334D">TMEM 视角</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="720.0" y="544.175" fill="#20334D">新结果 Acc[m, n] 的行 / 列</text><line stroke-width="2" x1="470" y1="530" x2="505" y2="530" stroke="#5F7086" /><polygon points="505,530 495.0,524.0 495.0,536.0" fill="#5F7086" /><rect x="970" y="485" width="430" height="90" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1185.0" y="515.8249999999999" fill="#20334D">寄存器视角</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1185.0" y="544.175" fill="#20334D">线程 tid 的第 n 个结果</text><line stroke-width="2" x1="935" y1="530" x2="970" y2="530" stroke="#5F7086" /><polygon points="970,530 960.0,524.0 960.0,536.0" fill="#5F7086" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="start" x="65" y="645.0" fill="#20334D">注意：MMA 会产生新数值。A 的某个元素并不是“原样变成”一个 Acc 元素。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="65" y="717.65" fill="#20334D">GMEM / SMEM 是地址布局；TV 是访问分工；MMA 是运算分块；TMEM 是专用编码地址。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="65" y="747.35" fill="#20334D">同一个 Tensor 可以被多个视图描述，只有 copy / gemm 等操作才真正搬运或计算。</text></svg>