<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800"><rect x="0" y="0" width="1440" height="800" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">v1 / v2 的输出 TMEM 布局相同</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">这里展示程序可寻址的逻辑行列，不将 TMEM 当作普通线性字节数组。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="start" x="40" y="165.0" fill="#20334D">TMEM：128 行 × 256 列 FP32，所有 K 分块累加在这里</text><rect x="40" y="215" width="780" height="76" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="430.0" y="253.0" fill="white">warp 0 读取行 0～31   ·   列 0～255</text><rect x="40" y="309" width="780" height="76" fill="#138A78" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="430.0" y="347.0" fill="white">warp 1 读取行 32～63   ·   列 0～255</text><rect x="40" y="403" width="780" height="76" fill="#9A65A8" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="430.0" y="441.0" fill="white">warp 2 读取行 64～95   ·   列 0～255</text><rect x="40" y="497" width="780" height="76" fill="#C47527" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="430.0" y="535.0" fill="white">warp 3 读取行 96～127   ·   列 0～255</text><rect x="885" y="240" width="510" height="170" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1140.0" y="295.3" fill="#20334D">每个线程对应一行</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1140.0" y="325.0" fill="#20334D">每次 tcgen05.ld 取 8 个 FP32</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1140.0" y="354.70000000000005" fill="#20334D">共执行 256/8 = 32 轮</text><rect x="885" y="450" width="510" height="110" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1140.0" y="489.47499999999997" fill="#20334D">8×FP32 → 8×BF16</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1140.0" y="520.525" fill="#20334D">打包成 16B，写回 Global C</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="start" x="40" y="650.0" fill="#20334D">tid = warp_id×32 + lane_id</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="701.0" fill="#20334D">线程 tid 写 C[off_m + tid, off_n + 8n : off_n + 8n + 8]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="start" x="40" y="757.0" fill="#5F7086">输入的 SMEM swizzle 不会改变输出矩阵的行列含义；TMEM 读取使用相同的 Layout D。</text></svg>