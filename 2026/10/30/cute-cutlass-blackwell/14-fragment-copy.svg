<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="970" viewBox="0 0 1440 970"><rect x="0" y="0" width="1440" height="970" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">入门图 B｜建立视图、准备 fragment、执行 copy，是三个不同动作</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">get_slice 和 partition 描述访问分工；本图的 fragment 是局部数值存储，尚未讨论 UMMA 描述符。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="start" x="40" y="167.5" fill="#20334D">① partition</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="start" x="515" y="167.5" fill="#20334D">② make_fragment_like</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="start" x="990" y="167.5" fill="#20334D">③ copy</text><rect x="40" y="230" width="410" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="245.0" y="263.125" fill="#20334D">gPart</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="245.0" y="296.875" fill="#20334D">指向 GMEM 的两个位置</text><rect x="515" y="230" width="410" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="720.0" y="263.125" fill="#20334D">rFrag</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="720.0" y="296.875" fill="#20334D">准备两个局部存储位置</text><rect x="990" y="230" width="410" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="1195.0" y="263.125" fill="#20334D">rFrag</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="1195.0" y="296.875" fill="#20334D">已经从 GMEM 读入数值</text><rect x="75" y="390" width="340" height="70" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="245.0" y="425.0" fill="#20334D">gA[0,1]</text><rect x="75" y="490" width="340" height="70" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="245.0" y="525.0" fill="#20334D">gA[1,1]</text><rect x="550" y="390" width="340" height="70" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="720.0" y="425.0" fill="#20334D">r[0]：尚未载入 A</text><rect x="1025" y="390" width="340" height="70" fill="#DDEFE8" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="1195.0" y="425.0" fill="#20334D">r[0] = 1</text><rect x="550" y="490" width="340" height="70" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="720.0" y="525.0" fill="#20334D">r[1]：尚未载入 A</text><rect x="1025" y="490" width="340" height="70" fill="#DDEFE8" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="1195.0" y="525.0" fill="#20334D">r[1] = 5</text><line stroke-width="2" x1="450" y1="280" x2="515" y2="280" stroke="#5F7086" /><polygon points="515,280 505.0,274.0 505.0,286.0" fill="#5F7086" /><line stroke-width="2" x1="925" y1="280" x2="990" y2="280" stroke="#5F7086" /><polygon points="990,280 980.0,274.0 980.0,286.0" fill="#5F7086" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="start" x="50" y="647.5" fill="#20334D">上方箭头表示代码执行顺序；前两步没有复制 A 的数值。</text><rect x="50" y="720" width="630" height="150" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="365.0" y="762.6" fill="#20334D">普通 CUDA 的对应理解</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="365.0" y="795.0" fill="#20334D">float r[2];</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="365.0" y="827.4000000000001" fill="#20334D">r[0] = A[1];  r[1] = A[5];</text><rect x="740" y="720" width="630" height="150" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1055.0" y="763.9499999999999" fill="#20334D">Blackwell SS UMMA 的输入 fragment</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1055.0" y="794.9999999999999" fill="#20334D">可以是 SMEM 描述符，而不是数值数组。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1055.0" y="826.05" fill="#20334D">先看 fragment 类型，再判断它保存什么。</text></svg>