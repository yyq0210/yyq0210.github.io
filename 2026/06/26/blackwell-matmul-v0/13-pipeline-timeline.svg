<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect x="0" y="0" width="1440" height="1000" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">V0 三级流水线：预热 → 稳态 → 排空</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">示例 K=384，共 6 个 K=64 tile。表格表示程序顺序，不按真实耗时比例绘制。</text><rect x="40" y="145" width="150" height="60" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="115.0" y="175.0" fill="#20334D">轮次</text><rect x="190" y="145" width="300" height="60" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="340.0" y="175.0" fill="#20334D">新提交的复制组</text><rect x="490" y="145" width="250" height="60" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="615.0" y="175.0" fill="#20334D">wait_group 2 保证</text><rect x="740" y="145" width="260" height="60" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="870.0" y="175.0" fill="#20334D">compute 消费</text><rect x="1000" y="145" width="400" height="60" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="1200.0" y="175.0" fill="#20334D">允许不等待的最近两组</text><rect x="40" y="205" width="150" height="72" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-