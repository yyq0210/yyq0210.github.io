<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920"><rect x="0" y="0" width="1440" height="920" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">7-stage 流水线：TMA 与 MMA 可以领先到哪里？</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">下面是一种合法的事件交错示例，不是必须发生的唯一顺序，也不是实测性能时间线。</text><rect x="40" y="150" width="75" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="77.5" y="182.5" fill="#20334D">事件</text><rect x="115" y="150" width="435" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="332.5" y="182.5" fill="#20334D">TMA 控制线程</text><rect x="550" y="150" width="435" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="767.5" y="182.5" fill="#20334D">MMA 控制线程</text><rect x="985" y="150" width="415" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="1192.5" y="182.5" fill="#20334D">关键含义</text><rect x="40" y="230" width="75" height="78" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="77.5" y="269.0" fill="#20334D">A</text><rect x="115" y="230" width="435" height="78" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="332.5" y="269.0" fill="#20334D">提交 L0、L1…</text><rect x="550" y="230" width="435" height="78" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="767.5" y="269.0" fill="#20334D">T0 就绪后提交 C0</text><rect x="985" y="230" width="415" height="78" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="1192.5" y="269.0" fill="#20334D">其余空槽位可继续预取</text><rect x="40" y="316" width="75" height="78" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="77.5" y="355.0" fill="#20334D">B</text><rect x="115" y="316" width="435" height="78" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="332.5" y="355.0" fill="#20334D">继续提交直到 L6</text><rect x="550" y="316" width="435" height="78" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="767.5" y="355.0" fill="#20334D">T1 就绪可提交 C1</text><rect x="985" y="316" width="415" height="78" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="1192.5" y="355.0" fill="#20334D">C1 可在 C0 完成前提交</text><rect x="40" y="402" width="75" height="78" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="77.5" y="441.0" fill="#20334D">C</text><rect x="115" y="402" width="435" height="78" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="332.5" y="441.0" fill="#20334D">尝试 L7：等待 D0</text><rect x="550" y="402" width="435" height="78" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="767.5" y="441.0" fill="#20334D">可继续尝试 C2、C3…</text><rect x="985" y="402" width="415" height="78" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="1192.5" y="441.0" fill="#20334D">L7 不能提前覆盖 stage 0</text><rect x="40" y="488" width="75" height="78" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="77.5" y="527.0" fill="#20334D">D</text><rect x="115" y="488" width="435" height="78" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="332.5" y="527.0" fill="#20334D">D0 完成 → 提交 L7</text><rect x="550" y="488" width="435" height="78" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="767.5" y="527.0" fill="#20334D">已提交的 MMA 按依赖推进</text><rect x="985" y="488" width="415" height="78" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="1192.5" y="527.0" fill="#20334D">此刻其他旧计算可能未完成</text><rect x="40" y="574" width="75" height="78" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="77.5" y="613.0" fill="#20334D">E</text><rect x="115" y="574" width="435" height="78" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="332.5" y="613.0" fill="#20334D">尝试 L8：等待 D1</text><rect x="550" y="574" width="435" height="78" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="767.5" y="613.0" fill="#20334D">tile 7 搬好才能提交 C7</text><rect x="985" y="574" width="415" height="78" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="1192.5" y="613.0" fill="#20334D">槽位独立通知，循环继续</text><rect x="40" y="660" width="75" height="78" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="77.5" y="699.0" fill="#20334D">F</text><rect x="115" y="660" width="435" height="78" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="332.5" y="699.0" fill="#20334D">最后一次 load 已提交</text><rect x="550" y="660" width="435" height="78" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="767.5" y="699.0" fill="#20334D">最后一次 compute + commit(F)</text><rect x="985" y="660" width="415" height="78" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="1192.5" y="699.0" fill="#20334D">所有输出线程等 F 再读 TMEM</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="40" y="812.5" fill="#20334D">tile 7 的数据就绪通知仍用 T0（第 2 代），并不存在第 8 个 T barrier。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="40" y="872.5" fill="#20334D">独立推进不等于无依赖并行：同一槽位严格遵守 L(i) → C(i) 完成 → L(i+7)。</text></svg>