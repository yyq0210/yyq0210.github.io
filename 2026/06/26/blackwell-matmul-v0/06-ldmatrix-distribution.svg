<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="870" viewBox="0 0 1440 870"><rect x="0" y="0" width="1440" height="870" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">一个 8×8 小矩阵，如何分到 32 个 lane？</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">ldmatrix.x4 中的第 j 张小矩阵：L(8j+r) 提供第 r 行起始地址；每行由 4 个 lane 接收。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="387.5" y="179.0" fill="#5F7086">列 0,1</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="662.5" y="179.0" fill="#5F7086">列 2,3</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="937.5" y="179.0" fill="#5F7086">列 4,5</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="1212.5" y="179.0" fill="#5F7086">列 6,7</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="141.0" y="228.0" fill="#5F7086">行 0：L0+8j</text><rect x="250" y="200" width="275" height="56" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="387.5" y="228.0" fill="#20334D">L0：col 0,1</text><rect x="525" y="200" width="275" height="56" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="662.5" y="228.0" fill="#20334D">L1：col 2,3</text><rect x="800" y="200" width="275" height="56" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="937.5" y="228.0" fill="#20334D">L2：col 4,5</text><rect x="1075" y="200" width="275" height="56" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="1212.5" y="228.0" fill="#20334D">L3：col 6,7</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="141.0" y="284.0" fill="#5F7086">行 1：L1+8j</text><rect x="250" y="256" width="275" height="56" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="387.5" y="284.0" fill="#20334D">L4：col 0,1</text><rect x="525" y="256" width="275" height="56" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="662.5" y="284.0" fill="#20334D">L5：col 2,3</text><rect x="800" y="256" width="275" height="56" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="937.5" y="284.0" fill="#20334D">L6：col 4,5</text><rect x="1075" y="256" width="275" height="56" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="1212.5" y="284.0" fill="#20334D">L7：col 6,7</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="141.0" y="340.0" fill="#5F7086">行 2：L2+8j</text><rect x="250" y="312" width="275" height="56" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="387.5" y="340.0" fill="#20334D">L8：col 0,1</text><rect x="525" y="312" width="275" height="56" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="662.5" y="340.0" fill="#20334D">L9：col 2,3</text><rect x="800" y="312" width="275" height="56" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="937.5" y="340.0" fill="#20334D">L10：col 4,5</text><rect x="1075" y="312" width="275" height="56" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="1212.5" y="340.0" fill="#20334D">L11：col 6,7</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="141.0" y="396.0" fill="#5F7086">行 3：L3+8j</text><rect x="250" y="368" width="275" height="56" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="387.5" y="396.0" fill="#20334D">L12：col 0,1</text><rect x="525" y="368" width="275" height="56" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="662.5" y="396.0" fill="#20334D">L13：col 2,3</text><rect x="800" y="368" width="275" height="56" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="937.5" y="396.0" fill="#20334D">L14：col 4,5</text><rect x="1075" y="368" width="275" height="56" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="1212.5" y="396.0" fill="#20334D">L15：col 6,7</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="141.0" y="452.0" fill="#5F7086">行 4：L4+8j</text><rect x="250" y="424" width="275" height="56" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="387.5" y="452.0" fill="#20334D">L16：col 0,1</text><rect x="525" y="424" width="275" height="56" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="662.5" y="452.0" fill="#20334D">L17：col 2,3</text><rect x="800" y="424" width="275" height="56" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="937.5" y="452.0" fill="#20334D">L18：col 4,5</text><rect x="1075" y="424" width="275" height="56" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="1212.5" y="452.0" fill="#20334D">L19：col 6,7</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="141.0" y="508.0" fill="#5F7086">行 5：L5+8j</text><rect x="250" y="480" width="275" height="56" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="387.5" y="508.0" fill="#20334D">L20：col 0,1</text><rect x="525" y="480" width="275" height="56" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="662.5" y="508.0" fill="#20334D">L21：col 2,3</text><rect x="800" y="480" width="275" height="56" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="937.5" y="508.0" fill="#20334D">L22：col 4,5</text><rect x="1075" y="480" width="275" height="56" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="1212.5" y="508.0" fill="#20334D">L23：col 6,7</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="141.0" y="564.0" fill="#5F7086">行 6：L6+8j</text><rect x="250" y="536" width="275" height="56" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="387.5" y="564.0" fill="#20334D">L24：col 0,1</text><rect x="525" y="536" width="275" height="56" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="662.5" y="564.0" fill="#20334D">L25：col 2,3</text><rect x="800" y="536" width="275" height="56" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="937.5" y="564.0" fill="#20334D">L26：col 4,5</text><rect x="1075" y="536" width="275" height="56" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="1212.5" y="564.0" fill="#20334D">L27：col 6,7</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="141.0" y="620.0" fill="#5F7086">行 7：L7+8j</text><rect x="250" y="592" width="275" height="56" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="387.5" y="620.0" fill="#20334D">L28：col 0,1</text><rect x="525" y="592" width="275" height="56" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="662.5" y="620.0" fill="#20334D">L29：col 2,3</text><rect x="800" y="592" width="275" height="56" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="937.5" y="620.0" fill="#20334D">L30：col 4,5</text><rect x="1075" y="592" width="275" height="56" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" dominant-baseline="central" text-anchor="middle" x="1212.5" y="620.0" fill="#20334D">L31：col 6,7</text><rect x="40" y="700" width="1360" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="720.0" y="732.5" fill="#20334D">每格 = 一个 32-bit 寄存器 = 2 个 BF16；每个接收 lane 从每张矩阵拿一格。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="809.0" fill="#20334D">x4 共四张矩阵 → 每个 lane 得到 reg 0、1、2、3。地址提供线程与接收线程是两套角色。</text></svg>