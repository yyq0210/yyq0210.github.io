/><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="1200.0" y="529.0" fill="#20334D">G4 / G5</text><rect x="40" y="565" width="150" height="72" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="115.0" y="601.0" fill="#20334D">i=4 排空</text><rect x="190" y="565" width="300" height="72" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="340.0" y="601.0" fill="#20334D">E0：空组</text><rect x="490" y="565" width="250" height="72" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="615.0" y="601.0" fill="#20334D">G4 完成</text><rect x="740" y="565" width="260" height="72" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="870.0" y="601.0" fill="#20334D">tile 4 / S1</text><rect x="1000" y="565" width="400" height="72" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="1200.0" y="601.0" fill="#20334D">G5 / E0</text><rect x="40" y="637" width="150" height="72" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="115.0" y="673.0" fill="#20334D">i=5 排空</text><rect x="190" y="637" width="300" height="72" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="340.0" y="673.0" fill="#20334D">E1：空组</text><rect x="490" y="637" width="250" height="72" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="615.0" y="673.0" fill="#20334D">G5 完成</text><rect x="740" y="637" width="260" height="72" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="870.0" y="673.0" fill="#20334D">tile 5 / S2</text><rect x="1000" y="637" width="400" height="72" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="1200.0" y="673.0" fill="#20334D">E0 / E1</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="767.5" fill="#20334D">G：某次 load_AB 的 cp.async 复制组；S：SMEM 槽位；E：没有新复制操作的空组。</text><rect x="40" y="810" width="1360" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="720.0" y="842.5" fill="#20334D">i=1 复用 S0 写 tile 3 时，tile 0 已在上一轮 compute 中消费完，并通过 block barrier。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="935.0" fill="#20334D">“允许不等待”不代表一定未完成。每个线程有自己的组序列；全 block 执行相同的提交节奏。</text></svg>