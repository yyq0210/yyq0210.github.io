<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930"><rect x="0" y="0" width="1440" height="930" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">只跟踪 stage 0：旧数据何时能被覆盖？</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">每次 load 都包含 A/B 两条 TMA；每次 compute 包含 4 条 MMA 与一次到 D0 的 commit。</text><rect x="40" y="150" width="80" height="83" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" dominant-baseline="central" text-anchor="middle" x="80.0" y="191.5" fill="white">1</text><rect x="140" y="150" width="730" height="83" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="505.0" y="191.5" fill="#20334D">L0：初始空闲，提交 tile 0 的 TMA</text><rect x="890" y="150" width="510" height="83" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1145.0" y="191.5" fill="#20334D">写 stage 0；T0 跟踪 phase 0</text><rect x="40" y="255" width="80" height="83" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" dominant-baseline="central" text-anchor="middle" x="80.0" y="296.5" fill="white">2</text><rect x="140" y="255" width="730" height="83" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="505.0" y="296.5" fill="#20334D">TMA(0) 完成 → T0 phase 0 完成</text><rect x="890" y="255" width="510" height="83" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1145.0" y="296.5" fill="#20334D">compute(0) 的 wait 才能通过</text><rect x="40" y="360" width="80" height="83" fill="#138A78" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" dominant-baseline="central" text-anchor="middle" x="80.0" y="401.5" fill="white">3</text><rect x="140" y="360" width="730" height="83" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="505.0" y="401.5" fill="#20334D">C0：提交 MMA，commit 到 D0</text><rect x="890" y="360" width="510" height="83" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1145.0" y="401.5" fill="#20334D">返回不代表 MMA 已完成</text><rect x="40" y="465" width="80" height="83" fill="#138A78" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" dominant-baseline="central" text-anchor="middle" x="80.0" y="506.5" fill="white">4</text><rect x="140" y="465" width="730" height="83" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="505.0" y="506.5" fill="#20334D">MMA(0) 完成 → D0 phase 0 完成</text><rect x="890" y="465" width="510" height="83" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1145.0" y="506.5" fill="#20334D">load(7) 的 wait 才能通过</text><rect x="40" y="570" width="80" height="83" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" dominant-baseline="central" text-anchor="middle" x="80.0" y="611.5" fill="white">5</text><rect x="140" y="570" width="730" height="83" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="505.0" y="611.5" fill="#20334D">L7：覆盖 stage 0，搬入 tile 7</text><rect x="890" y="570" width="510" height="83" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1145.0" y="611.5" fill="#20334D">T0 跟踪 phase 1</text><rect x="40" y="675" width="80" height="83" fill="#9A65A8" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" dominant-baseline="central" text-anchor="middle" x="80.0" y="716.5" fill="white">6</text><rect x="140" y="675" width="730" height="83" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="505.0" y="716.5" fill="#20334D">T0 phase 1 完成 → C7 → D0 phase 1</text><rect x="890" y="675" width="510" height="83" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1145.0" y="716.5" fill="#20334D">随后 L14 才可覆盖 stage 0</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="start" x="40" y="847.5" fill="#20334D">“提交 MMA”与“D0 完成”是两个事件。中间这段时间，stage 0 仍然不能覆盖。</text></svg>