<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><rect x="0" y="0" width="1440" height="940" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">07｜一轮 K64 = 4 次 UMMA；每次都更新完整的 128×256 输出</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">指令大小 128×256×16；颜色表示本轮第 j 个 K16 子块，不表示线程归属。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="start" x="40" y="160.0" fill="#20334D">SMEM A：128×64</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="start" x="770" y="160.0" fill="#20334D">SMEM B：256×64（逻辑 B^T）</text><rect x="40" y="210" width="138" height="220" fill="#D6E9FA" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="109.0" y="306.5" fill="#20334D">j=0</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="109.0" y="333.5" fill="#20334D">K 0…15</text><rect x="770" y="210" width="138" height="220" fill="#D6E9FA" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="839.0" y="306.5" fill="#20334D">j=0</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="839.0" y="333.5" fill="#20334D">K 0…15</text><rect x="185" y="210" width="138" height="220" fill="#D4EEE7" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="254.0" y="306.5" fill="#20334D">j=1</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="254.0" y="333.5" fill="#20334D">K 16…31</text><rect x="915" y="210" width="138" height="220" fill="#D4EEE7" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="984.0" y="306.5" fill="#20334D">j=1</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="984.0" y="333.5" fill="#20334D">K 16…31</text><rect x="330" y="210" width="138" height="220" fill="#E9DDF3" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="399.0" y="306.5" fill="#20334D">j=2</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="399.0" y="333.5" fill="#20334D">K 32…47</text><rect x="1060" y="210" width="138" height="220" fill="#E9DDF3" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="1129.0" y="306.5" fill="#20334D">j=2</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="1129.0" y="333.5" fill="#20334D">K 32…47</text><rect x="475" y="210" width="138" height="220" fill="#F8E4CC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="544.0" y="306.5" fill="#20334D">j=3</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="544.0" y="333.5" fill="#20334D">K 48…63</text><rect x="1205" y="210" width="138" height="220" fill="#F8E4CC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="1274.0" y="306.5" fill="#20334D">j=3</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="1274.0" y="333.5" fill="#20334D">K 48…63</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="40" y="477.5" fill="#20334D">图上是逻辑子块；在物理 SMEM 中受 swizzle 排列，不是简单四条连续字节区间。</text><rect x="40" y="545" width="1340" height="105" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="710.0" y="580.625" fill="#20334D">j=0 → j=1 → j=2 → j=3</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="710.0" y="614.375" fill="#20334D">每次：Acc[m,n] += Σ(q=0…15) A[m,16j+q] × B[n,16j+q]</text><rect x="40" y="710" width="640" height="110" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" dominant-baseline="central" text-anchor="middle" x="360.0" y="747.4499999999999" fill="#20334D">TMEM Acc[128,256]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" dominant-baseline="central" text-anchor="middle" x="360.0" y="782.55" fill="#20334D">这 4 次指令一直累加到同一块结果上</text><rect x="730" y="710" width="650" height="110" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1055.0" y="749.475" fill="#20334D">tCrA / tCrB：4 个 SMEM 描述符</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1055.0" y="780.525" fill="#20334D">描述的是子块地址和布局，不存输入数值</text></svg>