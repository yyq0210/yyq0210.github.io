.5" y="478.1" fill="#20334D">小矩阵 j=3</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1192.5" y="507.8" fill="#20334D">地址提供者 L24–L31</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1192.5" y="537.5" fill="#20334D">物理行 8–15</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1192.5" y="567.2" fill="#20334D">K 8–15</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1192.5" y="596.9" fill="#20334D">返回 packed reg 3</text><rect x="60" y="685" width="585" height="95" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="352.5" y="717.65" fill="#20334D">A 的 x4 结果：reg 0,1,2,3</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="352.5" y="747.35" fill="#20334D">全部给同一个 A_rmem[k][m]</text><rect x="750" y="685" width="585" height="95" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1042.5" y="717.65" fill="#20334D">B 的 x4 结果：reg 0,1 → B_rmem[k][n]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1042.5" y="747.35" fill="#20334D">reg 2,3 → B_rmem[k][n+1]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="855.0" fill="#20334D">注意：L17 提供一行的地址，不意味着这行最后全放进 L17 的寄存器。下一图展开分发规则。</text></svg>