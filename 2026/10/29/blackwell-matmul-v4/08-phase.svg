<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850"><rect x="0" y="0" width="1440" height="850" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">phase 表示代数；phase ^ 1 等待上一代槽位释放</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">phase 是线程局部变量。两个控制线程按各自循环翻转，不要求在同一时刻翻转。</text><rect x="40" y="155" width="170" height="64" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="125.0" y="187.0" fill="#20334D">tile i</text><rect x="210" y="155" width="170" height="64" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="295.0" y="187.0" fill="#20334D">stage</text><rect x="380" y="155" width="170" height="64" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="465.0" y="187.0" fill="#20334D">代数 parity</text><rect x="550" y="155" width="460" height="64" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="780.0" y="187.0" fill="#20334D">TMA 端 wait(D, phase^1)</text><rect x="1010" y="155" width="390" height="64" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="1205.0" y="187.0" fill="#20334D">MMA 端 wait(T, phase)</text><rect x="40" y="235" width="170" height="82" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="125.0" y="276.0" fill="#20334D">0…6</text><rect x="210" y="235" width="170" height="82" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="295.0" y="276.0" fill="#20334D">0…6</text><rect x="380" y="235" width="170" height="82" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="465.0" y="276.0" fill="#20334D">0</text><rect x="550" y="235" width="460" height="82" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="780.0" y="276.0" fill="#20334D">1：初始空槽直接通过</text><rect x="1010" y="235" width="390" height="82" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1205.0" y="276.0" fill="#20334D">0：等首次数据</text><rect x="40" y="327" width="170" height="82" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="125.0" y="368.0" fill="#20334D">7…13</text><rect x="210" y="327" width="170" height="82" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="295.0" y="368.0" fill="#20334D">0…6</text><rect x="380" y="327" width="170" height="82" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="465.0" y="368.0" fill="#20334D">1</text><rect x="550" y="327" width="460" height="82" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="780.0" y="368.0" fill="#20334D">0：等 C0…C6</text><rect x="1010" y="327" width="390" height="82" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1205.0" y="368.0" fill="#20334D">1：等第二次数据</text><rect x="40" y="419" width="170" height="82" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="125.0" y="460.0" fill="#20334D">14…20</text><rect x="210" y="419" width="170" height="82" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="295.0" y="460.0" fill="#20334D">0…6</text><rect x="380" y="419" width="170" height="82" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="465.0" y="460.0" fill="#20334D">0</text><rect x="550" y="419" width="460" height="82" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="780.0" y="460.0" fill="#20334D">1：等 C7…C13</text><rect x="1010" y="419" width="390" height="82" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1205.0" y="460.0" fill="#20334D">0：等第三次数据</text><rect x="40" y="511" width="170" height="82" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="125.0" y="552.0" fill="#20334D">21…27</text><rect x="210" y="511" width="170" height="82" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="295.0" y="552.0" fill="#20334D">0…6</text><rect x="380" y="511" width="170" height="82" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="465.0" y="552.0" fill="#20334D">1</text><rect x="550" y="511" width="460" height="82" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="780.0" y="552.0" fill="#20334D">0：等 C14…C20</text><rect x="1010" y="511" width="390" height="82" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1205.0" y="552.0" fill="#20334D">1：等第四次数据</text><rect x="40" y="640" width="1360" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" dominant-baseline="central" text-anchor="middle" x="720.0" y="672.5" fill="#20334D">stage = i % 7；各自循环的 phase = floor(i / 7) % 2</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="765.0" fill="#20334D">第一轮没有旧 MMA；相反 parity 用来启动空槽位。不是“已经执行过一轮 MMA”。</text></svg>