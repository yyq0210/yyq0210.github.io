<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect x="0" y="0" width="1440" height="810" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">02｜用 2×4 小矩阵，拆开“逻辑编号 / 内存偏移 / 线程编号”</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">本图是教学用小例子，不是 Blackwell 指令的硬件布局。每格数字都是相应坐标下的编号。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="start" x="50" y="160.0" fill="#20334D">逻辑元素 (m,n)</text><rect x="50" y="195" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="97.5" y="227.5" fill="#20334D">0,0</text><rect x="145" y="195" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="192.5" y="227.5" fill="#20334D">0,1</text><rect x="240" y="195" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="287.5" y="227.5" fill="#20334D">0,2</text><rect x="335" y="195" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="382.5" y="227.5" fill="#20334D">0,3</text><rect x="50" y="260" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="97.5" y="292.5" fill="#20334D">1,0</text><rect x="145" y="260" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="192.5" y="292.5" fill="#20334D">1,1</text><rect x="240" y="260" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="287.5" y="292.5" fill="#20334D">1,2</text><rect x="335" y="260" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="382.5" y="292.5" fill="#20334D">1,3</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="50" y="375.0" fill="#20334D">CuTe 逻辑线性编号：m + 2n</text><rect x="50" y="410" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="97.5" y="442.5" fill="#20334D">0</text><rect x="145" y="410" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="192.5" y="442.5" fill="#20334D">2</text><rect x="240" y="410" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="287.5" y="442.5" fill="#20334D">4</text><rect x="335" y="410" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="382.5" y="442.5" fill="#20334D">6</text><rect x="50" y="475" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="97.5" y="507.5" fill="#20334D">1</text><rect x="145" y="475" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="192.5" y="507.5" fill="#20334D">3</text><rect x="240" y="475" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="287.5" y="507.5" fill="#20334D">5</text><rect x="335" y="475" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="382.5" y="507.5" fill="#20334D">7</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="520" y="160.0" fill="#20334D">带 padding 的内存：6m + n</text><rect x="520" y="195" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="567.5" y="227.5" fill="#20334D">0</text><rect x="615" y="195" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="662.5" y="227.5" fill="#20334D">1</text><rect x="710" y="195" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="757.5" y="227.5" fill="#20334D">2</text><rect x="805" y="195" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="852.5" y="227.5" fill="#20334D">3</text><rect x="520" y="260" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="567.5" y="292.5" fill="#20334D">6</text><rect x="615" y="260" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="662.5" y="292.5" fill="#20334D">7</text><rect x="710" y="260" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="757.5" y="292.5" fill="#20334D">8</text><rect x="805" y="260" width="95" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="852.5" y="292.5" fill="#20334D">9</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="1000" y="160.0" fill="#20334D">TV：线程 t=n，线程内 v=m</text><rect x="1000" y="195" width="95" height="65" fill="#D6E9FA" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="1047.5" y="227.5" fill="#20334D">T0</text><rect x="1095" y="195" width="95" height="65" fill="#D4EEE7" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="1142.5" y="227.5" fill="#20334D">T1</text><rect x="1190" y="195" width="95" height="65" fill="#E9DDF3" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="1237.5" y="227.5" fill="#20334D">T2</text><rect x="1285" y="195" width="95" height="65" fill="#F8E4CC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="1332.5" y="227.5" fill="#20334D">T3</text><rect x="1000" y="260" width="95" height="65" fill="#D6E9FA" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="1047.5" y="292.5" fill="#20334D">T0</text><rect x="1095" y="260" width="95" height="65" fill="#D4EEE7" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="1142.5" y="292.5" fill="#20334D">T1</text><rect x="1190" y="260" width="95" height="65" fill="#E9DDF3" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="1237.5" y="292.5" fill="#20334D">T2</text><rect x="1285" y="260" width="95" height="65" fill="#F8E4CC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="middle" x="1332.5" y="292.5" fill="#20334D">T3</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="start" x="520" y="375.0" fill="#20334D">同一格 (1,2)：</text><rect x="520" y="415" width="230" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="635.0" y="447.5" fill="#20334D">逻辑 id 5</text><rect x="780" y="415" width="255" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="907.5" y="447.5" fill="#20334D">内存 offset 8</text><rect x="1065" y="415" width="310" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="middle" x="1220.0" y="447.5" fill="#20334D">线程 2 · 值 1</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" dominant-baseline="central" text-anchor="start" x="65" y="605.0" fill="#20334D">TV(t,v) = v + 2t  →  逻辑坐标 (v,t)  →  内存 offset = 6v + t</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="65" y="699.475" fill="#20334D">TV 与 memory layout 的 stride 不同，完全正常：它们回答的是不同问题。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="65" y="730.525" fill="#20334D">只改变 layout 对象，不会把内存中的数值自动转置或重排。</text></svg>