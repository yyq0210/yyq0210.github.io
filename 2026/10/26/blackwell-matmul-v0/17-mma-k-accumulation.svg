<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060"><rect x="0" y="0" width="1440" height="1060" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">同一块输出，如何把整个 K=64 算完？</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">固定一个 (m,n)。下面只突出该 acc 子块的累加依赖；源码实际循环顺序是 k → m → n。</text><rect x="40" y="155" width="190" height="115" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="135.0" y="196.975" fill="#20334D">k=0</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="135.0" y="228.025" fill="#20334D">K 0–15</text><rect x="260" y="155" width="240" height="115" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="380.0" y="196.3" fill="#20334D">A(m,0)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="380.0" y="228.7" fill="#20334D">16×16</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="middle" x="537.5" y="212.5" fill="#20334D">×</text><rect x="580" y="155" width="240" height="115" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="700.0" y="196.3" fill="#20334D">B(n,0)^T</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="700.0" y="228.7" fill="#20334D">16×8</text><line stroke-width="2" x1="830" y1="213" x2="910" y2="213" stroke="#5F7086" /><polygon points="910,213 900,207 900,219" fill="#5F7086" /><rect x="930" y="155" width="470" height="115" fill="#E3EFF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1165.0" y="196.975" fill="#20334D">同一个 acc[m][n]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1165.0" y="228.025" fill="#20334D">16×8 FP32；每 lane 4 个</text><line stroke-width="2" x1="1165" y1="270" x2="1165" y2="320" stroke="#5F7086" /><polygon points="1165,320 1159,310 1171,310" fill="#5F7086" /><rect x="40" y="330" width="190" height="115" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="135.0" y="371.97499999999997" fill="#20334D">k=1</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="135.0" y="403.025" fill="#20334D">K 16–31</text><rect x="260" y="330" width="240" height="115" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="380.0" y="371.3" fill="#20334D">A(m,1)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="380.0" y="403.7" fill="#20334D">16×16</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="middle" x="537.5" y="387.5" fill="#20334D">×</text><rect x="580" y="330" width="240" height="115" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="700.0" y="371.3" fill="#20334D">B(n,1)^T</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="700.0" y="403.7" fill="#20334D">16×8</text><line stroke-width="2" x1="830" y1="388" x2="910" y2="388" stroke="#5F7086" /><polygon points="910,388 900,382 900,394" fill="#5F7086" /><rect x="930" y="330" width="470" height="115" fill="#E1F3EE" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1165.0" y="371.97499999999997" fill="#20334D">同一个 acc[m][n]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1165.0" y="403.025" fill="#20334D">16×8 FP32；每 lane 4 个</text><line stroke-width="2" x1="1165" y1="445" x2="1165" y2="495" stroke="#5F7086" /><polygon points="1165,495 1159,485 1171,485" fill="#5F7086" /><rect x="40" y="505" width="190" height="115" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="135.0" y="546.975" fill="#20334D">k=2</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="135.0" y="578.025" fill="#20334D">K 32–47</text><rect x="260" y="505" width="240" height="115" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="380.0" y="546.3000000000001" fill="#20334D">A(m,2)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="380.0" y="578.7" fill="#20334D">16×16</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="middle" x="537.5" y="562.5" fill="#20334D">×</text><rect x="580" y="505" width="240" height="115" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="700.0" y="546.3000000000001" fill="#20334D">B(n,2)^T</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="700.0" y="578.7" fill="#20334D">16×8</text><line stroke-width="2" x1="830" y1="563" x2="910" y2="563" stroke="#5F7086" /><polygon points="910,563 900,557 900,569" fill="#5F7086" /><rect x="930" y="505" width="470" height="115" fill="#EEE5F4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1165.0" y="546.975" fill="#20334D">同一个 acc[m][n]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1165.0" y="578.025" fill="#20334D">16×8 FP32；每 lane 4 个</text><line stroke-width="2" x1="1165" y1="620" x2="1165" y2="670" stroke="#5F7086" /><polygon points="1165,670 1159,660 1171,660" fill="#5F7086" /><rect x="40" y="680" width="190" height="115" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="135.0" y="721.975" fill="#20334D">k=3</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="135.0" y="753.025" fill="#20334D">K 48–63</text><rect x="260" y="680" width="240" height="115" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="380.0" y="721.3000000000001" fill="#20334D">A(m,3)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="380.0" y="753.7" fill="#20334D">16×16</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="middle" x="537.5" y="737.5" fill="#20334D">×</text><rect x="580" y="680" width="240" height="115" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="700.0" y="721.3000000000001" fill="#20334D">B(n,3)^T</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="700.0" y="753.7" fill="#20334D">16×8</text><line stroke-width="2" x1="830" y1="738" x2="910" y2="738" stroke="#5F7086" /><polygon points="910,738 900,732 900,744" fill="#5F7086" /><rect x="930" y="680" width="470" height="115" fill="#FFF0DC" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1165.0" y="721.975" fill="#20334D">同一个 acc[m][n]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1165.0" y="753.025" fill="#20334D">16×8 FP32；每 lane 4 个</text><rect x="40" y="890" width="1360" height="65" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="720.0" y="922.5" fill="#20334D">每 warp：4 个 k × 4 个 m × 8 个 n = 128 次 MMA；每 block：4 warps × 128 = 512 次。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="40" y="1002.5" fill="#20334D">下一外层 iter_k 接着累加这些 acc；只有全部 K tile 完成后，才转 BF16 并写回全局 C。</text></svg>