<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"><rect x="0" y="0" width="1440" height="820" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">4 个 warp：主循环只由两个 elected thread 控制</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">kernel 仍有 128 个线程；“warp 专门负责一项工作”不代表每个操作由整个 warp 发起。</text><rect x="40" y="155" width="140" height="60" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="110.0" y="185.0" fill="#20334D">warp</text><rect x="180" y="155" width="370" height="60" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="365.0" y="185.0" fill="#20334D">初始化</text><rect x="550" y="155" width="460" height="60" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="780.0" y="185.0" fill="#20334D">主循环</text><rect x="1010" y="155" width="390" height="60" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1205.0" y="185.0" fill="#20334D">输出阶段</text><rect x="40" y="230" width="140" height="84" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="110.0" y="272.0" fill="#20334D">0</text><rect x="180" y="230" width="370" height="84" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="365.0" y="272.0" fill="#20334D">1 个线程初始化 barrier</text><rect x="550" y="230" width="460" height="84" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="780.0" y="272.0" fill="#20334D">1 个 elected thread 发起 TMA</text><rect x="1010" y="230" width="390" height="84" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="1205.0" y="272.0" fill="#20334D">32 线程写行 0–31</text><rect x="40" y="322" width="140" height="84" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="110.0" y="364.0" fill="#20334D">1</text><rect x="180" y="322" width="370" height="84" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="365.0" y="364.0" fill="#20334D">整个 warp 分配 TMEM</text><rect x="550" y="322" width="460" height="84" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="780.0" y="364.0" fill="#20334D">1 个 elected thread 发起 MMA</text><rect x="1010" y="322" width="390" height="84" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="1205.0" y="364.0" fill="#20334D">32 线程写行 32–63</text><rect x="40" y="414" width="140" height="84" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="110.0" y="456.0" fill="#20334D">2</text><rect x="180" y="414" width="370" height="84" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="365.0" y="456.0" fill="#20334D">参与 CTA 同步</text><rect x="550" y="414" width="460" height="84" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="780.0" y="456.0" fill="#20334D">不发起 TMA/MMA</text><rect x="1010" y="414" width="390" height="84" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="1205.0" y="456.0" fill="#20334D">32 线程写行 64–95</text><rect x="40" y="506" width="140" height="84" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="110.0" y="548.0" fill="#20334D">3</text><rect x="180" y="506" width="370" height="84" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="365.0" y="548.0" fill="#20334D">参与 CTA 同步</text><rect x="550" y="506" width="460" height="84" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="780.0" y="548.0" fill="#20334D">不发起 TMA/MMA</text><rect x="1010" y="506" width="390" height="84" fill="white" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="middle" x="1205.0" y="548.0" fill="#20334D">32 线程写行 96–127</text><rect x="40" y="640" width="1360" height="70" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="720.0" y="675.0" fill="#20334D">两个控制线程各有自己的 iter_k 和 phase；不是两个 warp 共享一个变量。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="start" x="40" y="757.5" fill="#20334D">全部计算完成后，4 个 warp 共同读 TMEM；读完再由 warp 0 的全部线程协同释放 TMEM。</text></svg>