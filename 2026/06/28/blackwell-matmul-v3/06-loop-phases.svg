<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><rect x="0" y="0" width="1440" height="760" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">预取 → 主循环 → 收尾：以 K=4096 为例</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">BLOCK_K=128，num_iters=32，NUM_STAGES=2；tile 编号为 0～31。</text><rect x="40" y="165" width="380" height="115" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" dominant-baseline="central" text-anchor="middle" x="230.0" y="203.6" fill="white">预取 1 块</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" dominant-baseline="central" text-anchor="middle" x="230.0" y="241.4" fill="white">load(0)</text><rect x="530" y="165" width="380" height="115" fill="#138A78" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" dominant-baseline="central" text-anchor="middle" x="720.0" y="203.6" fill="white">主循环 31 轮</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" dominant-baseline="central" text-anchor="middle" x="720.0" y="241.4" fill="white">i = 0…30</text><rect x="1020" y="165" width="380" height="115" fill="#9A65A8" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" dominant-baseline="central" text-anchor="middle" x="1210.0" y="203.6" fill="white">收尾 1 块</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" dominant-baseline="central" text-anchor="middle" x="1210.0" y="241.4" fill="white">compute(31)</text><line stroke-width="2" x1="424" y1="220" x2="520" y2="220" stroke="#5F7086" /><polygon points="520,220 510,214 510,226" fill="#5F7086" /><line stroke-width="2" x1="914" y1="220" x2="1010" y2="220" stroke="#5F7086" /><polygon points="1010,220 1000,214 1000,226" fill="#5F7086" /><rect x="40" y="330" width="380" height="150" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="230.0" y="389.47499999999997" fill="#20334D">只发起搬运</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="230.0" y="420.525" fill="#20334D">不等待 tile 0 完成</text><rect x="530" y="330" width="380" height="150" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="720.0" y="372.59999999999997" fill="#20334D">load(i+1)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="720.0" y="404.99999999999994" fill="#20334D">compute(i)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="720.0" y="437.4" fill="#20334D">wait MMA(i)</text><rect x="1020" y="330" width="380" height="150" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1210.0" y="375.3" fill="#20334D">不再发起新 load</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1210.0" y="405.0" fill="#20334D">等待并消费最后的 tile</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="middle" x="1210.0" y="434.70000000000005" fill="#20334D">wait MMA(31)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="start" x="40" y="589.0" fill="#20334D">一般 S-stage：预取 S−1 块；主循环搬 i+S−1、算 i；最后消费 S−1 块。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="start" x="40" y="670.0" fill="#5F7086">源码的短 K 边界需要单独处理：T=K/BLOCK_K 必须满足 T≥S−1，且本例要求完整 K tile。</text></svg>