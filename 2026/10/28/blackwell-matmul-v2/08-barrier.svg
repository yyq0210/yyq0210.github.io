<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700"><rect x="0" y="0" width="1440" height="700" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">v2 时间线：单缓冲，搬运与计算依次完成</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">一个 mbarrier 轮流等待 TMA 和 MMA；phase 保存的是阶段奇偶性。</text><rect x="40" y="175" width="250" height="110" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="165.0" y="214.475" fill="white">TMA 0</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="165.0" y="245.525" fill="white">搬入 K[0:256]</text><line stroke-width="2" x1="293" y1="230" x2="312" y2="230" stroke="#5F7086" /><polygon points="312,230 302,224 302,236" fill="#5F7086" /><rect x="315" y="175" width="250" height="110" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="440.0" y="214.475" fill="#20334D">等待</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="440.0" y="245.525" fill="#20334D">phase=0</text><line stroke-width="2" x1="568" y1="230" x2="587" y2="230" stroke="#5F7086" /><polygon points="587,230 577,224 577,236" fill="#5F7086" /><rect x="590" y="175" width="250" height="110" fill="#138A78" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="715.0" y="214.475" fill="white">MMA 0</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="715.0" y="245.525" fill="white">发起 16 次</text><line stroke-width="2" x1="843" y1="230" x2="862" y2="230" stroke="#5F7086" /><polygon points="862,230 852,224 852,236" fill="#5F7086" /><rect x="865" y="175" width="250" height="110" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="990.0" y="214.475" fill="#20334D">等待</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="990.0" y="245.525" fill="#20334D">phase=1</text><line stroke-width="2" x1="1118" y1="230" x2="1137" y2="230" stroke="#5F7086" /><polygon points="1137,230 1127,224 1127,236" fill="#5F7086" /><rect x="1140" y="175" width="250" height="110" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1265.0" y="214.475" fill="white">TMA 1</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1265.0" y="245.525" fill="white">覆盖同一 SMEM</text><rect x="40" y="345" width="1350" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="715.0" y="378.8" fill="#20334D">TMA 完成条件：arrival 已满足，待完成字节数归零</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="715.0" y="411.2" fill="#20334D">A/B 合计 192 KiB；2D 和 3D 的期待字节数相同</text><rect x="40" y="480" width="1350" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="715.0" y="513.8000000000001" fill="#20334D">MMA 完成条件：commit 跟踪前面的 MMA，完成后通知 barrier</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="715.0" y="546.2" fill="#20334D">wait 通过后，才能安全复用 A/B 缓冲区</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" dominant-baseline="central" text-anchor="start" x="40" y="643.0" fill="#20334D">commit 不阻塞；fence 不代替等待；本版本没有实现下一轮 TMA 与当前 MMA 的重叠。</text></svg>