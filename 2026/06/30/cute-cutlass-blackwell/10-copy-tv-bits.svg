<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="875" viewBox="0 0 1440 875"><rect x="0" y="0" width="1440" height="875" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">10｜Copy Traits 的 1024 / 32：这里的 value 单位是 bit</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">TVLayout 先把参与线程 / 局部 bit 映射到逻辑 bit；ValID 再映射到 TMEM 编码的 bit 位置。</text><rect x="40" y="160" width="640" height="145" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="360.0" y="200.09999999999997" fill="#20334D">SrcLayout (32,1024):(0,1)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="360.0" y="232.5" fill="#20334D">同一 warp 的线程看到同一份</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="360.0" y="264.9" fill="#20334D">32 行 × 32 bit 源操作数</text><rect x="760" y="160" width="640" height="145" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1080.0" y="200.09999999999997" fill="#20334D">DstLayout (32,32):(32,1)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1080.0" y="232.5" fill="#20334D">lane l 的局部 bit b</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="1080.0" y="264.9" fill="#20334D">对应逻辑 bit = 32l + b</text><line stroke-width="2" x1="680" y1="230" x2="760" y2="230" stroke="#5F7086" /><polygon points="760,230 750.0,224.0 750.0,236.0" fill="#5F7086" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" dominant-baseline="central" text-anchor="start" x="45" y="390.0" fill="#20334D">一列的逻辑 bit 区间</text><rect x="45" y="435" width="164" height="85" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="127.0" y="465.34999999999997" fill="#20334D">lane 0</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="127.0" y="489.65" fill="#20334D">bit 0…31</text><rect x="215" y="435" width="164" height="85" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="297.0" y="465.34999999999997" fill="#20334D">lane 1</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="297.0" y="489.65" fill="#20334D">bit 32…63</text><rect x="385" y="435" width="164" height="85" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="467.0" y="465.34999999999997" fill="#20334D">lane 2</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="467.0" y="489.65" fill="#20334D">bit 64…95</text><rect x="555" y="435" width="164" height="85" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="637.0" y="465.34999999999997" fill="#20334D">lane 3</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="637.0" y="489.65" fill="#20334D">bit 96…127</text><rect x="725" y="435" width="164" height="85" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="807.0" y="465.34999999999997" fill="#20334D">lane 4</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="807.0" y="489.65" fill="#20334D">bit 128…159</text><rect x="895" y="435" width="164" height="85" fill="#DDEFE8" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="977.0" y="465.34999999999997" fill="#20334D">lane 5</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="977.0" y="489.65" fill="#20334D">bit 160…191</text><rect x="1065" y="435" width="164" height="85" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="1147.0" y="465.34999999999997" fill="#20334D">lane 6</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="1147.0" y="489.65" fill="#20334D">bit 192…223</text><rect x="1235" y="435" width="164" height="85" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="1317.0" y="465.34999999999997" fill="#20334D">lane 7</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" dominant-baseline="central" text-anchor="middle" x="1317.0" y="489.65" fill="#20334D">bit 224…255</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="45" y="565.0" fill="#20334D">… 直到 lane 31 的 bit 992…1023</text><rect x="45" y="640" width="1330" height="110" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="710.0" y="678.125" fill="#20334D">选 lane 5、bit 7 → 逻辑 bit 167</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="710.0" y="711.875" fill="#20334D">ValID 将 167 拆成 row=5、bit=7 → TMEM 位偏移 = (5 &lt;&lt; 21) + 7</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="45" y="810.0" fill="#20334D">32 bit = 1 个 FP32；1024 bit = 整个 warp 的 32 个 FP32，不是每个线程读 1024 个 float。</text></svg>