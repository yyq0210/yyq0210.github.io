<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"><rect x="0" y="0" width="1440" height="820" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">SMEM 环形缓冲：两个 stage，总量仍为 192 KiB</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">BLOCK_M=128，BLOCK_N=256，BLOCK_K=128；每 stage 含 A 32 KiB + B 64 KiB。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="146.0" fill="#5F7086">0B</text><rect x="240" y="145" width="510" height="100" fill="#276EA4" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="495.0" y="195.0" fill="white">stage 0 · A · 32 KiB</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="246.0" fill="#5F7086">32768B</text><rect x="240" y="245" width="510" height="200" fill="#138A78" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="495.0" y="345.0" fill="white">stage 0 · B · 64 KiB</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="446.0" fill="#5F7086">98304B</text><rect x="240" y="445" width="510" height="100" fill="#9A65A8" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="495.0" y="495.0" fill="white">stage 1 · A · 32 KiB</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="546.0" fill="#5F7086">131072B</text><rect x="240" y="545" width="510" height="200" fill="#C47527" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="middle" x="495.0" y="645.0" fill="white">stage 1 · B · 64 KiB</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="746.0" fill="#5F7086">196608B</text><rect x="830" y="185" width="560" height="110" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="1110.0" y="223.125" fill="#20334D">stage_id = iter_k % 2</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="1110.0" y="256.875" fill="#20334D">0 → 1 → 0 → 1 → …</text><rect x="830" y="340" width="560" height="110" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1110.0" y="379.47499999999997" fill="#20334D">A 起点</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1110.0" y="410.525" fill="#20334D">smem + stage_id × 98304</text><rect x="830" y="490" width="560" height="110" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1110.0" y="529.475" fill="#20334D">B 起点</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="middle" x="1110.0" y="560.525" fill="#20334D">A 起点 + 32768</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="start" x="830" y="675.5" fill="#5F7086">barrier / TMEM 地址槽是另行声明的元数据；</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" dominant-baseline="central" text-anchor="start" x="830" y="702.5" fill="#5F7086">图中 192 KiB 指 A/B 动态数据区。</text></svg>