<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect x="0" y="0" width="1440" height="900" fill="white" stroke="none" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" dominant-baseline="central" text-anchor="start" x="40" y="48.0" fill="#20334D">入门图 A｜get_slice 选择参与者的规则，partition 再应用到具体数据</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" dominant-baseline="central" text-anchor="start" x="40" y="100.0" fill="#5F7086">教学设定：2×4 矩阵、4 个线程，每个线程负责一列。不是 UMMA 指令的实际 TVLayout。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" dominant-baseline="central" text-anchor="start" x="50" y="157.5" fill="#20334D">tiled_copy：所有线程的分工规则</text><rect x="50" y="205" width="310" height="70" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="205.0" y="240.0" fill="#20334D">T0 → 第 0 列</text><rect x="390" y="205" width="310" height="70" fill="#DAEBF9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="545.0" y="240.0" fill="#20334D">T1 → 第 1 列</text><rect x="730" y="205" width="310" height="70" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="885.0" y="240.0" fill="#20334D">T2 → 第 2 列</text><rect x="1070" y="205" width="310" height="70" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="1225.0" y="240.0" fill="#20334D">T3 → 第 3 列</text><line stroke-width="2" x1="545" y1="275" x2="545" y2="330" stroke="#5F7086" /><polygon points="545,330 551.0,320.0 539.0,320.0" fill="#5F7086" /><rect x="275" y="330" width="800" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="675.0" y="363.125" fill="#20334D">get_slice(1)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="675.0" y="396.875" fill="#20334D">取出 T1 的规则：“我负责第 1 列”</text><line stroke-width="2" x1="675" y1="430" x2="675" y2="490" stroke="#5F7086" /><polygon points="675,490 681.0,480.0 669.0,480.0" fill="#5F7086" /><rect x="275" y="490" width="800" height="100" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="675.0" y="523.125" fill="#20334D">partition_S(gA)</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="675.0" y="556.875" fill="#20334D">将 T1 的规则应用到矩阵 gA</text><line stroke-width="2" x1="675" y1="590" x2="675" y2="650" stroke="#5F7086" /><polygon points="675,650 681.0,640.0 669.0,640.0" fill="#5F7086" /><rect x="150" y="650" width="1140" height="110" fill="#F0F4F9" stroke="#CCD7E4" /><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="720.0" y="688.125" fill="#20334D">gPart 指向 gA[0,1] 与 gA[1,1]</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" dominant-baseline="central" text-anchor="middle" x="720.0" y="721.875" fill="#20334D">原矩阵没有搬动；目前只是得到访问这两个位置的视图</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" dominant-baseline="central" text-anchor="start" x="50" y="827.5" fill="#20334D">同一个 thr_copy 还可以对另一张匹配布局的矩阵做 partition；规则不等于具体数据。</text></svg>