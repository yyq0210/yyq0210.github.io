<polygon points="232,532 220,544 244,544" fill="#8A97A6"/>
<rect x="28" y="556" width="408" height="88" rx="16" fill="#fff" stroke="#C05621" stroke-width="3"/>
<text x="232" y="594" text-anchor="middle" font-size="20" font-weight="700" fill="#1B3A5C">Core Attention</text>
<text x="232" y="622" text-anchor="middle" font-size="15" fill="#5B6B7C">→ residual / mHC → MoE</text>
</g>
<text x="62" y="910" font-size="17" fill="#3D4D5C">Encoder Full：ratio=2；Decoder L20 Full：ratio=1。</text>
<text x="62" y="940" font-size="17" fill="#3D4D5C">Reindex 刷新稀疏选择；SWA 窗口滑动是另一条状态线。Top-K / 候选池按当前 query 跨层共享。</text>
</g></svg>