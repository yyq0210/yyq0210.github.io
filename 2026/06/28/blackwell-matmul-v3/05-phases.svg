"PingFang SC, Microsoft YaHei, sans-serif" font-size="24" dominant-baseline="central" text-anchor="start" x="40" y="673.0" fill="#20334D">每个 stage 都消费一代之后，才将下一圈等待的 parity 翻转。</text><text font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" dominant-baseline="central" text-anchor="start" x="40" y="760.0" fill="#5F7086">某个未来 TMA 可能提前完成；表中值是 wait 的期望参数，不是硬件实时状态快照。</text></svg>